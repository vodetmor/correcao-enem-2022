<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correção ENEM</title>
<meta name="description" content="Cartão-resposta digital do ENEM: marque suas respostas e veja a nota TRI estimada, o gabarito, o raio-X e a evolução entre simulados. Funciona offline.">
<style>
:root{
  --bg:#F6F9FE;--card:#fff;--ink:#131820;--muted:#57626F;--line:#DDE3EB;--soft:#EEF2F8;
  --green:#0A7A34;--greenbg:#E3F6E9;--blue:#0F5BFF;--bluebg:#E8EFFF;
  --ok:#0A7A34;--okbg:#E3F6E9;--bad:#C0362C;--badbg:#FDECEA;--warn:#8A5A00;--warnbg:#FFF3DC;
  --bubble:#9AA5B5;--sel:#131820;--shadow:0 4px 16px rgba(19,24,32,.08),0 1px 2px rgba(19,24,32,.05);
  --onbtn:#fff;--bar:rgba(246,249,254,.94);--scrim:rgba(19,24,32,.5);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
}
:root[data-theme=dark]{
  --bg:#0E1116;--card:#171B22;--ink:#EDF1F6;--muted:#9AA6B6;--line:#2A313C;--soft:#1F252E;
  --green:#3DD17A;--greenbg:#12301F;--blue:#6C9BFF;--bluebg:#16233F;
  --ok:#3DD17A;--okbg:#12301F;--bad:#FF8076;--badbg:#3A1A18;--warn:#F2C26B;--warnbg:#33290F;
  --bubble:#5C6675;--sel:#EDF1F6;--shadow:0 4px 16px rgba(0,0,0,.4);--onbtn:#06210f;--bar:rgba(14,17,22,.94);--scrim:rgba(0,0,0,.65);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.12;margin:6px 0 6px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--green)}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0 0 8px}
p{margin:0 0 8px}
.hint{color:var(--muted);font-size:.9rem}
.hidden{display:none!important}
code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--soft);padding:1px 6px;border-radius:6px}
a{color:var(--blue)}

/* topo e abas */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{appearance:none;border:0;background:transparent;font:inherit;font-weight:700;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;color:var(--ink);padding:4px 0}
.brand b{color:var(--green)}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:3px 10px;min-width:64px;cursor:pointer;font:inherit;text-align:center;line-height:1.15;flex:none}
.tab span{display:block;font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tab b{font-size:.98rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.tab.ok b{color:var(--green)}
.tab[aria-selected=true]{border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.tab:hover{border-color:var(--green)}
.bar-act{display:flex;gap:6px;flex:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.9rem}
.btn.ic{width:42px;padding:0}
.btn:focus-visible,.chip:focus-visible,.b:focus-visible,.q:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.tab:focus-visible,.brand:focus-visible,input:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-weight:600;margin:0 0 6px;display:block;font-size:.88rem;color:var(--muted)}
.chip{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 14px;font-size:.92rem}
.note.info{background:var(--bluebg);color:var(--blue)}
.note.good{background:var(--greenbg);color:var(--green)}
.trava{border:2px dashed var(--line);border-radius:16px;padding:26px 14px;text-align:center;color:var(--muted);background:var(--soft)}
.sel{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.sel>div{min-width:0}
@media(min-width:760px){.sel{grid-template-columns:auto minmax(0,1fr);column-gap:32px}}
.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:10px 14px;margin-bottom:16px}

/* acordeões */
details.acc{border-top:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;padding:13px 20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted);font-weight:400}
details.acc[open]>summary::after{content:"–"}
details.acc>summary small{font-weight:400;color:var(--muted);margin-left:8px}
.acc-b{padding:0 20px 18px}
details.paste summary{cursor:pointer;font-weight:600;font-size:.92rem}

/* área */
.area{padding:0;overflow:hidden}
.area-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px}
.area-h h2 small{display:block;font-size:.85rem;font-weight:400;color:var(--muted);margin-top:2px}
.pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;width:100%;max-width:240px;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .2s}
.nota-pill{background:var(--greenbg);color:var(--green);border-radius:16px;padding:6px 18px;text-align:center;line-height:1.1}
.nota-pill b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}
.nota-pill small{font-size:.72rem;font-weight:600;letter-spacing:.03em}
.sum{padding:0 20px 14px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.stat b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.main b{color:var(--green)}
.stat span{color:var(--muted);font-size:.82rem}
.sheet{display:grid;grid-auto-flow:row;grid-template-columns:minmax(0,1fr);gap:2px 28px;margin-top:10px}
@media(min-width:640px){.sheet{grid-auto-flow:column;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(23,auto)}}
@media(min-width:1000px){.b{width:34px;height:34px}.sheet{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 20px;grid-template-rows:repeat(15,auto)}}
.sheet.lock .b{pointer-events:none}
.q{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 6px;border-radius:12px;border:2px solid transparent}
.q:focus{outline:none}
.q:focus-visible{border-color:#7fa6ff;background:var(--bluebg)}
.q .n{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.q .bs{display:flex;gap:6px;flex:1;flex-wrap:nowrap;min-width:0}
.b{appearance:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--bubble);background:var(--card);color:var(--muted);font:600 .78rem/1 inherit;cursor:pointer;padding:0;flex:none;display:grid;place-items:center}
.b:hover{border-color:var(--ink);color:var(--ink)}
.b[aria-checked=true]{background:var(--sel);border-color:var(--sel);color:var(--card)}
.b.br{border-style:dashed}
.b.br[aria-checked=true]{background:#64748b;border-color:#64748b;color:#fff}
.q.fora{background:var(--soft)}
.q.fora.certa{background:var(--okbg)}.q.fora.errada{background:var(--badbg)}
.q .tag{font-size:.68rem;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:2px 8px;margin-left:4px;white-space:nowrap}
.q.certa{background:var(--okbg)}.q.errada{background:var(--badbg)}
.q.certa .b[aria-checked=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.q.errada .b[aria-checked=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.q .b.gab{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}
textarea{width:100%;min-height:72px;font:1rem/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;letter-spacing:.05em;background:var(--card);color:var(--ink)}
select,input[type=text]{font:inherit;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:42px}

/* dock fixo: sempre ao alcance do polegar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dock-in .info{min-width:0}
.dock-in .info b{font-variant-numeric:tabular-nums}
.dock-in .nota{font-size:1.5rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal-card{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:92vh;overflow:auto}
@media(min-width:640px){.modal-card{border-radius:24px}}
.modal-card h3{font-size:1.15rem}
.bignota{font-size:3.2rem;font-weight:700;color:var(--green);line-height:1.05;font-variant-numeric:tabular-nums}
.modal-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* raio-x e tabela */
.xr{display:grid;gap:8px;margin-top:8px}
@media(min-width:800px){.xr{grid-template-columns:1fr 1fr}}
.xi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.xi .tp{display:flex;justify-content:space-between;gap:8px;font-weight:600;flex-wrap:wrap}
.xi p{margin:0;color:var(--muted);font-size:.88rem}
.pb{height:8px;border-radius:99px;background:var(--soft);margin:8px 0;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok)}
.pb.low i{background:var(--bad)}.pb.mid i{background:#E39A00}
.filter{margin:10px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-size:.8rem;color:var(--muted)}
td.c{text-align:center}
tr.r-ok td.res-c{color:var(--ok);font-weight:700}
tr.r-er td.res-c{color:var(--bad);font-weight:700}
tr.r-er{background:var(--badbg)}
tr.fora td{color:var(--muted)}
.par{display:none}.showpar .par{display:table-cell}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.dif{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--soft)}
.dif.f{background:var(--greenbg);color:var(--green)}.dif.m{background:var(--warnbg);color:var(--warn)}.dif.d{background:var(--badbg);color:var(--bad)}
.enun-r td{white-space:normal;background:var(--bg)}
.enun{max-width:760px;padding:6px 4px}
.enun p{margin:0 0 8px;font-size:.92rem}
.enun ul{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.enun li{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.enun li.gab{border-color:var(--ok);background:var(--okbg)}
.enun li.voce{border-color:var(--bad);background:var(--badbg)}

/* seletor de dia */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:48px;line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:.78rem}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}
/* redação */
.redgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.redgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.redfbw{position:sticky;top:130px}}
.rrow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.rrow{scroll-margin-top:118px}
.rrow.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.rrow .rt{font-weight:600;font-size:.92rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.rrow .rt span+span{color:var(--green);font-variant-numeric:tabular-nums}
.rrow .inl{display:none}
@media(max-width:899px){.rrow.on .inl{display:block;margin-top:10px}.redfbw{display:none}}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.lv{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;min-height:40px;font-variant-numeric:tabular-nums}
.lv:hover{border-color:var(--green)}
.lv[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.lv:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}
.redfb{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.redfb h3{margin:0 0 6px;font-size:1rem}
.redfb p{font-size:.92rem;margin:0 0 8px}
.redfb .why{border-left:3px solid var(--blue);padding-left:10px}
.redfb .up{border-left:3px solid var(--green);padding-left:10px}
.redfb .tip{border-left:3px solid var(--warn);padding-left:10px}
.foco{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.foco span{background:var(--warnbg);color:var(--warn);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:600}

/* boletim, lobby, dashboard */
.bol{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.tile span{display:block;color:var(--muted);font-size:.82rem}
.tile b{font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.ok b{color:var(--green)}
.tile.dia{background:var(--soft)}
.final{margin-top:12px;border-radius:20px;padding:18px 20px;background:var(--greenbg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.final b{font-size:2.6rem;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}
.final span{color:var(--muted)}
.cursos{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.hero{padding:10px 0 4px}
.sub{color:var(--muted);max-width:680px;margin:0 0 12px}
.examcard{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.examcard>*{min-width:0}
.examcard h2{font-size:1.3rem}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.chartbox{position:relative;margin-top:12px}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartbox .tip{position:absolute;top:8px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.85rem;box-shadow:var(--shadow);white-space:nowrap;z-index:2;transform:translateX(-50%)}
.chartbox .tip b{display:block;margin-bottom:2px}
.chartbox .tip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sers .chip{min-height:36px;padding:4px 12px;font-size:.88rem;border-width:1.5px}
.delta.up{color:var(--ok);font-weight:600}.delta.dn{color:var(--bad);font-weight:600}
.foot{font-size:.9rem;color:var(--muted)}
.foot b{color:var(--ink)}
.foot ol{margin:6px 0 10px 20px;padding:0}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:50;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:560px){details.acc>summary small{display:none}.topbar-in{padding:6px 10px;flex-wrap:wrap}.brand{flex:1;text-align:left}.tabs{order:3;flex:1 0 100%;gap:4px}.tab{min-width:0;flex:1;padding:3px 2px}html{scroll-padding-top:112px}.panel{padding:16px;border-radius:16px}.area-h{padding:14px}.sum{padding:0 14px 12px}.acc-b{padding:0 14px 14px}details.acc>summary{padding:12px 14px}.q .tag{font-size:.6rem;padding:2px 5px;margin-left:0}.q{gap:4px;padding:3px 4px}.q .bs{gap:4px}.b{width:33px;height:33px}.q .n{width:26px}.stat b{font-size:1.3rem}.wrap{padding:12px 12px 120px}.bignota{font-size:2.8rem}}
@media(max-width:350px){.b{width:28px;height:28px;font-size:.7rem}.q .n{width:22px}.wrap{padding:12px 10px 120px}}
@media print{.topbar,.dock,.btn{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <button class="brand" id="home" type="button" title="Voltar ao início">Correção <b>ENEM</b></button>
    <nav class="tabs hidden" id="tabs" role="tablist" aria-label="Áreas da prova"></nav>
    <div class="bar-act">
      <button class="btn pri sm" id="salvar" type="button">Salvar</button>
      <button class="btn ic sm" id="tema" type="button" aria-label="Alternar tema claro e escuro" title="Alternar tema">◐</button>
    </div>
  </div>
</div>
<main class="wrap" id="main"></main>
<div class="dock hidden" id="dock"></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-label="Aviso"><div class="modal-card" id="modalCard"></div></div>
<div class="toast hidden" id="toast" role="status"></div>
<input type="file" id="bkFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
const EXAMS = {
  enem2022:{
    id:"enem2022", nome:"ENEM 2022 · Regular", sigla:"ENEM 2022", desc:"Aplicação regular, dias 1 e 2, cadernos Azul, Amarelo, Branco, Rosa e Cinza.",
    areas:{
      LC:{nome:"Linguagens e Códigos",base:1,dia:1,lang:true},
      CH:{nome:"Ciências Humanas",base:46,dia:1},

const NIVEIS = [0,40,80,120,160,200];
const SERIES = [["MED","Média","--s1"],["LC","Linguagens","--s2"],["CH","Humanas","--s3"],["CN","Natureza","--s4"],["MT","Matemática","--s5"],["RED","Redação","--s6"]];

/* ---------- estado ---------- */
function novoEstado(ex){
  const e = {tab:Object.keys(ex.areas)[0],cor:{1:null,2:null},lang:null,ans:{},env:{},red:[null,null,null,null,null],hist:[]};
  for(const a in ex.areas){ e.ans[a]=Array(45).fill(""); e.env[a]=false; }
  return e;
}
function lerCampos(o,ex,e){
  for(const d of [1,2]){ const c=o.cor&&o.cor[d]; if(ex.cores[d].includes(c)) e.cor[d]=c; }
  if(o.lang===0||o.lang===1) e.lang=o.lang;
  const env=o.env||o.calc||{};
  for(const a in ex.areas){
    const v=o.ans&&o.ans[a];
    if(Array.isArray(v)&&v.length===45) e.ans[a]=v.map(x=>(LETRAS.includes(x)||x==="-")?x:"");
    e.env[a]=!!env[a];
  }
  if(Array.isArray(o.red)&&o.red.length===5) e.red=o.red.map(x=>NIVEIS.includes(x)?x:null);
}
function validar(o,ex){
  const e = novoEstado(ex); if(!o || typeof o!=="object") return e;
  const tabs=[...Object.keys(ex.areas),"RED","RES"]; if(tabs.includes(o.tab)) e.tab=o.tab;
  lerCampos(o,ex,e);
  if(Array.isArray(o.hist)) e.hist=o.hist.slice(-100).map(h=>{
    if(!h||typeof h!=="object") return null;
    const x=novoEstado(ex); lerCampos(h,ex,x);
    const notas={}; for(const s of SERIES){ const v=h.notas&&h.notas[s[0]]; notas[s[0]]=(typeof v==="number"&&v>=0&&v<=1000)?v:null; }
    return {id:Number(h.id)||Date.now(),t:Number(h.t)||Date.now(),nn:Number(h.nn)||null,nome:String(h.nome||"Simulado").slice(0,60),cor:x.cor,lang:x.lang,ans:x.ans,env:x.env,red:x.red,notas};
  }).filter(Boolean);
  return e;
}
function validarStore(o){
  const st={v:3,view:"lobby",exam:Object.keys(EXAMS)[0],estados:{}};
  if(o&&typeof o==="object"){
    if(EXAMS[o.exam]) st.exam=o.exam;
    if(o.view==="exam") st.view="exam";
    for(const id in EXAMS) st.estados[id]=validar(o.estados&&o.estados[id],EXAMS[id]);

}

}

  store=validarStore(o); setExam(store.exam);

/* ---------- cálculo ---------- */
function diaTemLang(d){ return Object.keys(AREAS).some(a=>AREAS[a].dia===d&&AREAS[a].lang); }
function diaLiberado(d,st=S){ return !!st.cor[d] && (!diaTemLang(d) || st.lang!==null); }
function caderno(a,st=S){
  const d=AREAS[a].dia; if(!diaLiberado(d,st)) return null;
  const c = DATA.cad[a][st.cor[d]];
  return AREAS[a].lang ? c[st.lang] : c;
}
function eap(its, oks){
  let max=-Infinity; const ll = GRID.map(g=>{
    let s=0;
    for(let i=0;i<its.length;i++){
      const A=its[i][0],B=its[i][1],C=its[i][2];
      let p=C+(1-C)/(1+Math.exp(-A*(g-B)));
      p=Math.min(1-1e-9,Math.max(1e-9,p));
      s+=Math.log(oks[i]?p:1-p);
    }
    const lp=s-0.5*g*g; if(lp>max)max=lp; return lp;
  });
  let sw=0,sg=0; for(let i=0;i<GRID.length;i++){ const w=Math.exp(ll[i]-max); sw+=w; sg+=w*GRID[i]; }
  return sg/sw;
}
function nota(a,th){ const k=DATA.k[a]; return k[0]+k[1]*th; }
/* pronto = o aluno clicou em Corrigir (st.env[a]); sem marcação conta como em branco */
function analisar(a,st=S){
  const idx = caderno(a,st); if(!idx) return null;
  const itens = idx.map(k=>DATA.items[a][k]), ans = st.ans[a];
  const validas = []; itens.forEach((it,j)=>{ if(it[0]!==null) validas.push(j); });
  const r = {itens,validas,ans,idx};
  r.feitas = validas.filter(j=>ans[j]!=="").length;
  r.pronto = !!st.env[a];
  /* questões fora do cálculo: marcáveis para estudo; acerto é só informativo (null = sem marcação ou anulada, gabarito X) */
  r.info = {};
  itens.forEach((it,j)=>{ if(it[0]!==null) return; const g=it[4], v=ans[j]; r.info[j]=(v===""||v==="-"||!LETRAS.includes(g))?null:(v===g); });
  if(!r.pronto) return r;
  const par = validas.map(j=>itens[j]);
  const oks = validas.map(j=>ans[j]===itens[j][4]);
  r.acertos = oks.filter(Boolean).length;
  r.brancos = validas.filter(j=>ans[j]===""||ans[j]==="-").length;
  r.erros = validas.length-r.acertos-r.brancos;
  r.semMarca = validas.length-r.feitas;
  r.todosBrancos = r.brancos===validas.length;
  r.theta = r.todosBrancos ? null : eap(par,oks);
  r.nota = r.todosBrancos ? 0 : nota(a,r.theta);
  r.delta = {};
  if(!r.todosBrancos){
    validas.forEach((j,n)=>{ const o2=oks.slice(); o2[n]=!o2[n]; r.delta[j]=nota(a,eap(par,o2))-r.nota; });
  }
  r.ok = {}; validas.forEach((j,n)=>r.ok[j]=oks[n]);
  return r;
}
const fmt = (x,d=1)=>x.toFixed(d).replace(".",",");
function dificuldade(a,b){ const t=DATA.tert[a]; return b<=t[0]?["Fácil","f"]:b<=t[1]?["Média","m"]:["Difícil","d"]; }
const CACHE = {};
function analisarC(a){
  const k=a+"|"+(S.cor[AREAS[a].dia]||"")+"|"+S.lang+"|"+S.env[a]+"|"+S.ans[a].join("");
  if(!(k in CACHE)){ CACHE[k]=analisar(a); if(Object.keys(CACHE).length>80) delete CACHE[Object.keys(CACHE)[0]]; }
  return CACHE[k];
}
function redSoma(st=S){ return st.red.every(x=>x!==null)?st.red.reduce((s,x)=>s+x,0):null; }
/* notas de um estado (rascunho ou tentativa): áreas corrigidas, redação e média simples das disponíveis */
function notasDe(st){
  const n={}, vs=[];
  for(const a in AREAS){ const r=analisar(a,st); n[a]=r&&r.pronto?r.nota:null; if(n[a]!==null) vs.push(n[a]); }
  n.RED=redSoma(st); if(n.RED!==null) vs.push(n.RED);
  n.MED=vs.length?vs.reduce((s,x)=>s+x,0)/vs.length:null;
  n._n=vs.length; n._total=Object.keys(AREAS).length+1;
  return n;
}
function resumoGeral(){
  const n=notasDe(S);
  return {n:n._n,total:n._total,media:n.MED,completo:n._n===n._total,rs:n.RED,notas:n};
}

/* ---------- resultado de uma área ---------- */
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderSum(a,r){

/* dashboard: stats, gráfico de linhas, tabela (alternativa acessível) */
const CHARTS = {};
function dashHtml(id){
  const st=store.estados[id], hist=st.hist.slice().sort((a,b)=>a.t-b.t);
  if(!hist.length) return `<div class="empty">Nenhum simulado salvo ainda. Corrija as áreas, vá em <b>Resultado</b> e clique em <b>Salvar no histórico</b>: aqui você acompanha se a nota está subindo.</div>`;
  const meds=hist.map(h=>h.notas.MED).filter(v=>v!==null);
  const best=meds.length?Math.max(...meds):null, last=meds.length?meds[meds.length-1]:null, first=meds.length?meds[0]:null;
  const dv=meds.length>1?last-first:null;
  let h=`<div class="kpis"><div class="tile"><span>Simulados salvos</span><b>${hist.length}</b></div>
    <div class="tile ok"><span>Melhor média</span><b>${best!==null?fmt(best):"–"}</b></div>
    <div class="tile"><span>Última média</span><b>${last!==null?fmt(last):"–"}</b></div>
    <div class="tile"><span>Evolução (última vs primeira)</span><b class="${dv===null?"":dv>=0?"delta up":"delta dn"}">${dv===null?"–":(dv>=0?"▲ +":"▼ ")+fmt(dv)}</b></div></div>`;
  h+=`<div class="sers" role="group" aria-label="Séries do gráfico">`+SERIES.map(s=>`<button type="button" class="chip" aria-pressed="${CH_SEL.has(s[0])}" data-act="ser" data-s="${s[0]}"><span class="dot" style="background:var(${s[2]})"></span>${s[1]}</button>`).join("")+`</div>`;
  h+=`<div class="chartbox" id="cb-${id}">${chartSvg(hist,id)}</div>`;
  h+=`<div class="tblw" style="margin-top:12px"><table style="min-width:560px"><thead><tr><th>Simulado</th><th>Data</th><th>LC</th><th>CH</th><th>CN</th><th>MT</th><th>RED</th><th>Média</th><th>Δ média</th><th></th></tr></thead><tbody>`;
  let prev=null;
  hist.forEach(x=>{
    const n=x.notas, m=n.MED, dl=(m!==null&&prev!==null)?m-prev:null; if(m!==null) prev=m;
    const f=v=>v===null?"–":fmt(v);
    h+=`<tr><td><b>${esc(x.nome)}</b></td><td>${new Date(x.t).toLocaleDateString("pt-BR")}</td><td>${f(n.LC)}</td><td>${f(n.CH)}</td><td>${f(n.CN)}</td><td>${f(n.MT)}</td><td>${n.RED===null?"–":n.RED}</td><td><b>${f(m)}${x.nn&&x.nn<5?"*":""}</b></td><td>${dl===null?"–":`<span class="delta ${dl>=0?"up":"dn"}">${dl>=0?"▲ +":"▼ "}${fmt(dl)}</span>`}</td><td><button class="btn sm" type="button" data-act="abrirHist" data-id="${x.id}" data-ex="${id}">Abrir</button> <button class="btn sm danger" type="button" data-act="delHist" data-id="${x.id}" data-ex="${id}">Excluir</button></td></tr>`;
  });
  return h+`</tbody></table></div><p class="hint" style="margin-top:8px">* Simulado parcial: a média usa só as notas que existiam (menos de 5). Não compare diretamente com um simulado completo.</p>`;
}
function chartSvg(hist,uid){
  const n=hist.length, sel=SERIES.filter(s=>CH_SEL.has(s[0]));
  const val=(h,k)=>typeof h.notas[k]==="number"?h.notas[k]:null;
  const vs=sel.flatMap(s=>hist.map(h=>val(h,s[0])).filter(v=>v!==null));
  if(!sel.length||!vs.length) return `<div class="empty">Escolha ao menos uma série com dados para ver o gráfico.</div>`;
  let lo=Math.min(...vs), hi=Math.max(...vs); const span=Math.max(hi-lo,80), mid=(hi+lo)/2;
  lo=Math.floor((mid-span/2-20)/50)*50; hi=Math.ceil((mid+span/2+20)/50)*50; if(hi-lo<100) hi=lo+100;
  const W=640,H=260,L=44,R=100,T=12,B=30, pw=W-L-R, ph=H-T-B;
  const X=i=>n===1?L+pw/2:L+pw*i/(n-1), Y=v=>T+ph*(1-(v-lo)/(hi-lo));
  const step=(hi-lo)>400?100:50;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das notas por simulado. A tabela abaixo traz os mesmos valores.">`;
  for(let v=lo;v<=hi;v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  const every=n>14?Math.ceil(n/12):1;
  for(let i=0;i<n;i+=every){ s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}</text>`; }
  const labels=[];
  sel.forEach(se=>{
    const pts=hist.map((h,i)=>({i,v:val(h,se[0])})); let d="", open=false;
    pts.forEach(p=>{ if(p.v===null){ open=false; return; } d+=(open?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1)+" "; open=true; });
    const w=se[0]==="MED"?2.5:2;
    s+=`<path d="${d}" fill="none" stroke="var(${se[2]})" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{ if(p.v!==null) s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4.5" fill="var(${se[2]})" stroke="var(--card)" stroke-width="2"/>`; });
    const lastP=[...pts].reverse().find(p=>p.v!==null); if(lastP) labels.push({y:Y(lastP.v),x:X(lastP.i),t:`${se[1]} ${Math.round(lastP.v)}`});
  });
  labels.sort((a,b)=>a.y-b.y); for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<14) labels[i].y=labels[i-1].y+14;
  labels.forEach(l=>{ s+=`<text x="${l.x+10}" y="${l.y+4}" font-size="11.5" font-weight="600" fill="var(--ink)">${l.t}</text>`; });
  s+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  s+=`<rect class="hov" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip hidden"></div>`;
  CHARTS[uid]={hist,sel,n,L,pw,W,X};
  return s;
}
function initCharts(){
  document.querySelectorAll(".chartbox").forEach(box=>{
    const uid=box.id.replace("cb-",""), c=CHARTS[uid], svg=box.querySelector("svg"); if(!c||!svg) return;
    const xh=svg.querySelector(".xh"), tip=box.querySelector(".tip"), hov=svg.querySelector(".hov");
    const move=e=>{
      const rc=svg.getBoundingClientRect(), x=(e.clientX-rc.left)*(c.W/rc.width);
      let i=c.n===1?0:Math.round((x-c.L)/c.pw*(c.n-1)); i=Math.max(0,Math.min(c.n-1,i));
      const px=c.X(i); xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.style.display="";
      const h=c.hist[i];
      tip.innerHTML=`<b>${esc(h.nome)} · ${new Date(h.t).toLocaleDateString("pt-BR")}</b>${h.nn&&h.nn<5?`<div class="hint">parcial: ${h.nn} de 5 notas</div>`:""}`+c.sel.map(se=>{ const v=h.notas[se[0]]; return `<div><i style="background:var(${se[2]})"></i>${se[1]}: ${v===null?"–":fmt(v)}</div>`; }).join("");
      tip.classList.remove("hidden"); const pct=px/c.W*100; tip.style.left=Math.max(14,Math.min(86,pct))+"%";
    };
    const sai=()=>{ xh.style.display="none"; tip.classList.add("hidden"); };
    hov.addEventListener("pointermove",move); hov.addEventListener("pointerdown",move); hov.addEventListener("pointerleave",sai);
  });
}

/* ---------- lobby ---------- */
const TRANSP=`<p><b>Aviso:</b> é uma <b>estimativa</b> feita com dados públicos, não a nota oficial emitida pelo INEP.</p>
  <ol>
    <li>Cada questão tem três parâmetros públicos do INEP: <b>a</b> (discriminação), <b>b</b> (dificuldade) e <b>c</b> (acerto ao acaso). A chance de acertar é <code>P(θ) = c + (1 − c) / (1 + e^(−a·(θ − b)))</code>.</li>
    <li>Com seus acertos e erros, calculamos a proficiência θ pelo método <b>EAP</b> (média a posteriori), com distribuição a priori normal padrão e 40 pontos de quadratura entre −4 e 4, como descreve o documento "Procedimentos de Análise" do INEP. Questões sem marcação contam como em branco. Questões anuladas ou sem calibração podem ser marcadas para estudo, mas ficam fora da nota.</li>
    <li>θ vira nota por uma conversão linear própria de cada área: <code>nota = m + s · θ</code>. {{CONSTS}} O INEP não publica essas constantes; nós as obtivemos por regressão contra as notas oficiais.</li>
    <li>A "coerência das respostas" que o INEP cita é um efeito do próprio modelo: acertar questões difíceis e errar fáceis reduz a nota naturalmente. Não há regra extra.</li>
  </ol>
  <p><b>Validação:</b> {{VAL}}</p>
  <p><b>Limites:</b> vale para a aplicação regular, cadernos {{CADERNOS}}. Não vale para reaplicação, provas adaptadas (Laranja e Verde) nem outras aplicações. Se escolher o caderno errado, a nota sai errada, sem aviso. O INEP não publica o assunto de cada questão, só a habilidade da Matriz de Referência; é isso que o raio-X mostra. A orientação de redação segue os níveis oficiais do INEP. "Ver" mostra o enunciado extraído da prova oficial; "Pesquisar" busca na internet pela frase da questão.</p>`;
function renderLobby(){
  const main=$("main"); let h=`<header class="hero"><h1>Correção <em>ENEM</em></h1>
    <p class="sub">Escolha a prova, marque o cartão-resposta e veja a nota TRI estimada, o gabarito e onde melhorar. Roda no seu aparelho, sem internet e sem cadastro.</p></header>
    <div class="strip"><span class="hint">Seu preenchimento fica salvo neste navegador. Perdeu tudo? Carregue o seu backup.</span><div class="row"><button class="btn sm" data-act="bkDown" type="button">Baixar backup</button><button class="btn sm" data-act="bkUp" type="button">Carregar backup</button></div></div>`;
  for(const id in EXAMS){
    const ex=EXAMS[id], st=store.estados[id];
    const draft=Object.values(st.ans).some(v=>v.some(x=>x!==""))||Object.values(st.env).some(Boolean);
    const corr=Object.values(st.env).filter(Boolean).length;
    h+=`<section class="panel examcard"><div><h2>${ex.nome}</h2><p class="hint" style="margin:2px 0 0">${ex.desc}</p></div>
      <div class="row"><button class="btn pri" type="button" data-act="abrirExam" data-ex="${id}">${draft?"Continuar o simulado":"Corrigir um simulado"}</button>
      ${draft?`<span class="hint">${corr} de ${Object.keys(ex.areas).length} áreas corrigidas neste rascunho</span>`:""}</div>
      <div><h3>Seu desempenho</h3>${dashHtml(id)}</div></section>`;
  }
  h+=`<section class="panel"><p class="hint" style="margin:0">Mais provas entram aqui no futuro: cada uma aparece como um cartão acima.</p></section>
    <details class="panel acc foot" style="padding:0"><summary>Como a nota é calculada e validação</summary><div class="acc-b">${TRANSP}</div></details>`;
  main.innerHTML=h;
}

/* ---------- interação ---------- */
function toast(msg,acao){
  const t=$("toast"); t.innerHTML=`<span>${msg}</span>${acao?`<button type="button" id="toastAct">${acao}</button>`:""}`; t.classList.remove("hidden");
  const b=$("toastAct"); if(b) b.onclick=()=>{ baixarBackup(); t.classList.add("hidden"); };
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add("hidden"),4500);
}
function marcar(a,j,v){ if(S.env[a]) return; S.ans[a][j]=v; salvar(); pintar(a); }
function focarQ(a,j){ const q=document.querySelector(`#area-${a} .q[data-i="${j}"]`); if(q){ q.focus({preventScroll:true}); q.scrollIntoView({block:"nearest"}); } }
function avancar(a,j){
  if(j<44){ focarQ(a,j+1); return; }
  const p=document.querySelector("#dock [data-act=ask]"); if(p) p.focus();
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".b");
  if(b){ const q=b.closest(".q"), a=q.dataset.a, j=+q.dataset.i, v=b.dataset.v; marcar(a,j,S.ans[a][j]===v?"":v); focarQ(a,j); return; }
  const t=e.target.closest("[data-act]"); if(!t||t.tagName==="SELECT"||t.tagName==="INPUT") return;
  const a=t.dataset.a, act=t.dataset.act;
  switch(act){
    case "tab": fecharModal(); irAba(t.dataset.t); break;
    case "dia": { const d=+t.dataset.d, atual=AREAS[S.tab]&&AREAS[S.tab].dia; if(atual!==d) irAba(Object.keys(AREAS).find(x=>AREAS[x].dia===d)); break; }
    case "nota": { const i=+t.dataset.i, v=+t.dataset.v; S.red[i]=S.red[i]===v?null:v; REDFOCO=i; salvar(); const y=window.scrollY; renderRedPane(); renderTopo(); posRed(y); break; }
    case "comp": { REDFOCO=+t.dataset.i; const y=window.scrollY; renderRedPane(); posRed(y); break; }
    case "cor": S.cor[+t.dataset.d]=t.dataset.c; salvar(); renderPane(); break;
    case "lang": S.lang=+t.dataset.l; salvar(); renderPane(); break;
    case "ask": perguntarCorrigir(a); break;
    case "go": corrigir(a); break;
    case "fechar": fecharModal(); break;
    case "editar": S.env[a]=false; salvar(); renderPane(); break;
    case "start": { const idx=caderno(a); let j=S.ans[a].findIndex((x,k)=>x===""&&DATA.items[a][idx[k]][0]!==null); if(j<0)j=0; focarQ(a,j); break; }
    case "clr": if(confirm("Limpar todas as marcações de "+AREAS[a].nome+"?")){ S.ans[a]=Array(45).fill(""); S.env[a]=false; salvar(); renderPane(); } break;
    case "paste": colar(a); break;
    case "pasteDia": colarDia(t.dataset.m); break;
    case "enun": {
      const tr=t.closest("tr"), nx=tr.nextElementSibling;
      if(nx&&nx.classList.contains("enun-r")){ nx.remove(); t.textContent="Ver"; }
      else { const r=analisarC(a), n=document.createElement("tr"); n.className="enun-r"; n.innerHTML=`<td colspan="12">${enunHtml(a,+t.dataset.j,r)}</td>`; tr.after(n); t.textContent="Ocultar"; }
      break; }
    case "salvarHist": salvarHist(); break;
    case "novoSim": novoSim(); break;
    case "ser": { const s=t.dataset.s; if(CH_SEL.has(s)){ if(CH_SEL.size>1) CH_SEL.delete(s); } else CH_SEL.add(s); renderAll(); break; }
    case "abrirHist": setExam(t.dataset.ex); abrirHist(+t.dataset.id); break;
    case "delHist": { setExam(t.dataset.ex); apagarHist(+t.dataset.id,()=>renderAll()); break; }
    case "abrirExam": setExam(t.dataset.ex); store.view="exam"; salvar(); renderAll(); window.scrollTo({top:0,behavior:"auto"}); break;
    case "bkDown": baixarBackup(); break;
    case "bkUp": $("bkFile").click(); break;
    case "limparTudo": if(confirm("Apagar TODO o preenchimento e o histórico deste navegador? Baixe o backup antes se quiser guardar.")){ store=validarStore(null); setExam(store.exam); try{localStorage.removeItem(KEY);}catch(_){} renderAll(); toast("Tudo limpo."); } break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.act) return;
  if(t.dataset.act==="soerros"){ document.querySelectorAll(`#tb-${t.dataset.a} tbody tr`).forEach(tr=>tr.classList.toggle("hidden",t.checked&&tr.dataset.er!=="1"&&!tr.classList.contains("enun-r"))); }
  if(t.dataset.act==="params"){ $("tw-"+t.dataset.a).classList.toggle("showpar",t.checked); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("modal").classList.contains("hidden")){ fecharModal(); return; }
  const q=e.target.closest&&e.target.closest(".q"); if(!q) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const a=q.dataset.a, j=+q.dataset.i, k=e.key, L=k.length===1?k.toUpperCase():"";
  if(LETRAS.includes(L)){ e.preventDefault(); marcar(a,j,L); avancar(a,j); return; }
  if(k==="-"||k==="."||k===" "||k==="0"){ e.preventDefault(); marcar(a,j,"-"); avancar(a,j); return; }
  if(k==="Backspace"||k==="Delete"){ e.preventDefault(); marcar(a,j,""); if(k==="Backspace"&&j>0) focarQ(a,j-1); return; }
  if(k==="ArrowDown"||k==="ArrowRight"){ e.preventDefault(); if(j<44) focarQ(a,j+1); }
  if(k==="ArrowUp"||k==="ArrowLeft"){ e.preventDefault(); if(j>0) focarQ(a,j-1); }
});
$("modal").addEventListener("click",e=>{ if(e.target===$("modal")) fecharModal(); });
function lerColado(id,msg,n,txt){
  const t=$(id).value.toUpperCase().replace(/[\s,;|]/g,"");
  const bad=[...t].filter(c=>!"ABCDE.-*".includes(c));
  if(bad.length){ msg.textContent=`Caractere inválido: "${bad[0]}". Use só A, B, C, D, E, "-" ou ".".`; msg.style.color="var(--bad)"; return null; }
  if(t.length!==n){ msg.textContent=`Foram lidas ${t.length} respostas; são necessárias exatamente ${n} (${txt}).`; msg.style.color="var(--bad)"; return null; }
  return t;
}
function colarDia(modo){
  const d=AREAS[S.tab].dia, ar=Object.keys(AREAS).filter(x=>AREAS[x].dia===d), msg=$("pmsg-dia");
  const t=lerColado("paste-dia",msg,90,"45 de cada área, contando as anuladas"); if(t===null) return;
  ar.forEach((a,n)=>{ [...t.slice(n*45,n*45+45)].forEach((c,j)=>{ S.ans[a][j]=LETRAS.includes(c)?c:"-"; }); if(modo==="corr") S.env[a]=true; });
  salvar(); renderPane(); toast(modo==="corr"?"Respostas aplicadas e as duas áreas corrigidas.":"Respostas aplicadas. Revise e clique em Corrigir.");
}
function colar(a){
  const msg=$("pmsg-"+a);
  const t=lerColado("paste-"+a,msg,45,"uma por questão, contando as anuladas"); if(t===null) return;
  [...t].forEach((c,j)=>{ S.ans[a][j]=LETRAS.includes(c)?c:"-"; });
  salvar(); renderPane(); toast("Respostas aplicadas. Revise e clique em Corrigir.");
}

/* ---------- salvar e backup ---------- */
function baixarBackup(){
  const blob=new Blob([JSON.stringify({app:"correcao-enem",versao:3,salvoEm:new Date().toISOString(),store},null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download="backup-correcao-enem.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000); toast("Backup baixado. Guarde o arquivo em local seguro.");
}
$("salvar").onclick=()=>{
  const ok=salvar(), h=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  toast(ok?`Salvo neste navegador às ${h}.`:"Não consegui salvar neste navegador (modo privado?). Baixe o backup.","Baixar backup");
};
$("bkFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||o.app!=="correcao-enem"||!(o.store||o.estados)) throw new Error("fmt");
      const src=o.store||{exam:Object.keys(o.estados)[0],view:"exam",estados:o.estados};
      const n=validarStore(src);
      if(!confirm("Substituir o preenchimento e o histórico atuais pelos do backup?")){ e.target.value=""; return; }
      store=n; setExam(store.exam); salvar(); renderAll(); toast("Backup carregado.");
    }catch(_){ toast("⚠ Arquivo inválido. Use um backup gerado por esta página (backup-correcao-enem.json)."); }
    e.target.value="";
  };
  rd.readAsText(f);
};
$("home").onclick=()=>{ store.view="lobby"; salvar(); renderAll(); window.scrollTo({top:0,behavior:"auto"}); };

/* ---------- tema ---------- */
function aplicaTema(t){ document.documentElement.setAttribute("data-theme",t); }
(function(){
  let t=null; try{ t=localStorage.getItem(KEY_TEMA); }catch(_){}
  if(!t) t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  aplicaTema(t);
  $("tema").onclick=()=>{ t=t==="dark"?"light":"dark"; aplicaTema(t); try{localStorage.setItem(KEY_TEMA,t);}catch(_){} };
})();

carregar(); renderAll();
</script>

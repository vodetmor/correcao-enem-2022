<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correção ENEM</title>
<meta name="description" content="Cartão-resposta digital do ENEM: marque suas respostas e veja a nota TRI estimada, o gabarito, o raio-X e a evolução entre simulados. Funciona offline.">
<style>
:root{
  --bg:#F6F9FE;--card:#fff;--ink:#131820;--muted:#57626F;--line:#DDE3EB;--soft:#EEF2F8;
  --green:#0A7A34;--greenbg:#E3F6E9;--blue:#0F5BFF;--bluebg:#E8EFFF;
  --ok:#0A7A34;--okbg:#E3F6E9;--bad:#C0362C;--badbg:#FDECEA;--warn:#8A5A00;--warnbg:#FFF3DC;
  --bubble:#9AA5B5;--sel:#131820;--shadow:0 4px 16px rgba(19,24,32,.08),0 1px 2px rgba(19,24,32,.05);
  --onbtn:#fff;--bar:rgba(246,249,254,.94);--scrim:rgba(19,24,32,.5);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
}
:root[data-theme=dark]{
  --bg:#0E1116;--card:#171B22;--ink:#EDF1F6;--muted:#9AA6B6;--line:#2A313C;--soft:#1F252E;
  --green:#3DD17A;--greenbg:#12301F;--blue:#6C9BFF;--bluebg:#16233F;
  --ok:#3DD17A;--okbg:#12301F;--bad:#FF8076;--badbg:#3A1A18;--warn:#F2C26B;--warnbg:#33290F;
  --bubble:#5C6675;--sel:#EDF1F6;--shadow:0 4px 16px rgba(0,0,0,.4);--onbtn:#06210f;--bar:rgba(14,17,22,.94);--scrim:rgba(0,0,0,.65);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.12;margin:6px 0 6px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--green)}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0 0 8px}
p{margin:0 0 8px}
.hint{color:var(--muted);font-size:.9rem}
.hidden{display:none!important}
code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--soft);padding:1px 6px;border-radius:6px}
a{color:var(--blue)}

/* topo e abas */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{appearance:none;border:0;background:transparent;font:inherit;font-weight:700;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;color:var(--ink);padding:4px 0}
.brand b{color:var(--green)}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:3px 10px;min-width:64px;cursor:pointer;font:inherit;text-align:center;line-height:1.15;flex:none}
.tab span{display:block;font-size:.66rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tab b{font-size:.98rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.tab.ok b{color:var(--green)}
.tab[aria-selected=true]{border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.tab:hover{border-color:var(--green)}
.bar-act{display:flex;gap:6px;flex:none;margin-left:auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.9rem}
.btn.ic{width:42px;padding:0}
.btn:focus-visible,.chip:focus-visible,.b:focus-visible,.q:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.tab:focus-visible,.brand:focus-visible,input:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-weight:600;margin:0 0 6px;display:block;font-size:.88rem;color:var(--muted)}
.chip{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 14px;font-size:.92rem}
.note.info{background:var(--bluebg);color:var(--blue)}
.note.good{background:var(--greenbg);color:var(--green)}
.trava{border:2px dashed var(--line);border-radius:16px;padding:26px 14px;text-align:center;color:var(--muted);background:var(--soft)}
.sel{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.sel>div{min-width:0}
@media(min-width:760px){.sel{grid-template-columns:auto minmax(0,1fr);column-gap:32px}}
.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:10px 14px;margin-bottom:16px}

/* acordeões */
details.acc{border-top:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;padding:13px 20px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted);font-weight:400}
details.acc[open]>summary::after{content:"–"}
details.acc>summary small{font-weight:400;color:var(--muted);margin-left:8px}
.acc-b{padding:0 20px 18px}
details.paste summary{cursor:pointer;font-weight:600;font-size:.92rem}

/* área */
.area{padding:0;overflow:hidden}
.area-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px}
.area-h h2 small{display:block;font-size:.85rem;font-weight:400;color:var(--muted);margin-top:2px}
.pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;width:100%;max-width:240px;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .2s}
.nota-pill{background:var(--greenbg);color:var(--green);border-radius:16px;padding:6px 18px;text-align:center;line-height:1.1}
.nota-pill b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}
.nota-pill small{font-size:.72rem;font-weight:600;letter-spacing:.03em}
.sum{padding:0 20px 14px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats.pan{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.stk{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px;min-width:90px}
.stk i{display:block;height:100%}
.stk i.a{background:var(--ok)}.stk i.e{background:var(--bad)}.stk i.b{background:var(--bubble)}
.pantbl td,.pantbl th{white-space:nowrap}
.pantbl td.bar{min-width:110px;white-space:normal}
.paninfo{margin:10px 0 0}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.stat b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.main b{color:var(--green)}
.stat span{color:var(--muted);font-size:.82rem}
.sheet{display:grid;grid-auto-flow:row;grid-template-columns:minmax(0,1fr);gap:2px 28px;margin-top:10px}
@media(min-width:640px){.sheet{grid-auto-flow:column;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(23,auto)}}
@media(min-width:1000px){.b{width:34px;height:34px}}
.sheet.lock .b{pointer-events:none}
.q{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 6px;border-radius:12px;border:2px solid transparent}
.q:focus{outline:none}
.q:focus-visible{border-color:#7fa6ff;background:var(--bluebg)}
.q .n{width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.q .bs{display:flex;gap:6px;flex:1;flex-wrap:nowrap;min-width:0}
.b{appearance:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--bubble);background:var(--card);color:var(--muted);font:600 .78rem/1 inherit;cursor:pointer;padding:0;flex:none;display:grid;place-items:center}
.b:hover{border-color:var(--ink);color:var(--ink)}
.b[aria-checked=true]{background:var(--sel);border-color:var(--sel);color:var(--card)}
.b.br{border-style:dashed}
.b.br[aria-checked=true]{background:#64748b;border-color:#64748b;color:#fff}
.q.fora{background:var(--soft)}
.q.fora.certa{background:var(--okbg)}.q.fora.errada{background:var(--badbg)}
.q .tag{font-size:.68rem;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:2px 8px;margin-left:4px;white-space:nowrap}
.q.certa{background:var(--okbg)}.q.errada{background:var(--badbg)}
.q.certa .b[aria-checked=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.q.errada .b[aria-checked=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.q .b.gab{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}
textarea{width:100%;min-height:72px;font:1rem/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;letter-spacing:.05em;background:var(--card);color:var(--ink)}
select,input[type=text]{font:inherit;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:42px}

/* dock fixo: sempre ao alcance do polegar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dock-in .info{min-width:0}
.dock-in .info b{font-variant-numeric:tabular-nums}
.dock-in .nota{font-size:1.5rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal-card{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:92vh;overflow:auto}
@media(min-width:640px){.modal-card{border-radius:24px}}
.modal-card h3{font-size:1.15rem}
.bignota{font-size:3.2rem;font-weight:700;color:var(--green);line-height:1.05;font-variant-numeric:tabular-nums}
.modal-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* raio-x e tabela */
.xr{display:grid;gap:8px;margin-top:8px}
@media(min-width:800px){.xr{grid-template-columns:1fr 1fr}}
.xi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.xi .tp{display:flex;justify-content:space-between;gap:8px;font-weight:600;flex-wrap:wrap}
.xi p{margin:0;color:var(--muted);font-size:.88rem}
.pb{height:8px;border-radius:99px;background:var(--soft);margin:8px 0;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok)}
.pb.low i{background:var(--bad)}.pb.mid i{background:#E39A00}
.filter{margin:10px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-size:.8rem;color:var(--muted)}
td.c{text-align:center}
tr.r-ok td.res-c{color:var(--ok);font-weight:700}
tr.r-er td.res-c{color:var(--bad);font-weight:700}
tr.r-er{background:var(--badbg)}
tr.fora td{color:var(--muted)}
.par{display:none}.showpar .par{display:table-cell}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.dif{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--soft)}
.qn{appearance:none;background:none;border:0;font:inherit;cursor:pointer;border-radius:8px;padding:2px 4px;text-decoration:underline dotted;text-underline-offset:3px}
.qn:hover{color:var(--ink);background:var(--soft)}
.qn:focus-visible{outline:2px solid var(--blue)}
.modal-card.wide{max-width:680px}
#sim{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.sim-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line)}
.sim-h .ttl{font-weight:700;font-size:.95rem;min-width:0}.sim-h .ttl small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.sim-t{font:700 1.7rem/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:12px;background:var(--greenbg);color:var(--green);display:inline-block}
.sim-t.warn{background:var(--warnbg);color:var(--warn)}.sim-t.bad{background:var(--badbg);color:var(--bad)}
.sim-h .sp{flex:1}
.sim-h .seg{margin:0}
.sim-quadro{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.mq{font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.mq.pas{text-decoration:line-through;color:var(--muted);opacity:.65}
.mq.al{border-color:var(--warn);color:var(--warn)}
.mq.at{border-color:var(--green);box-shadow:0 0 0 2px var(--greenbg)}
.sim-b{flex:1;min-height:0;display:flex}
.sim-b.inv{flex-direction:row-reverse}
.sim-pdf,.sim-card{min-width:0;height:100%}
.sim-pdf{flex:0 0 calc(78% - 5px);background:var(--soft);display:flex;flex-direction:column}
.sim-pdf iframe{flex:1;width:100%;border:0;background:#fff}
.sim-pdf .semlink{padding:20px}
.sim-card{flex:1 1 0;overflow:auto;padding:12px 14px 40px}
#sim.m-pdf .sim-pdf{flex:1 1 auto!important}
#sim:not(.m-div) [data-act=simLado]{display:none}
#sim.m-pdf .zm{display:none}
.sim-div{flex:0 0 10px;position:relative;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center;outline:none}
.sim-div::before{content:"";position:absolute;inset:0 4px;background:var(--line);transition:background .15s}
.sim-div:hover::before,.sim-div:focus-visible::before,#sim.arrastando .sim-div::before{background:var(--green)}
.sim-div i{position:relative;z-index:1;width:18px;height:52px;border-radius:9px;background:var(--card);border:1px solid var(--green);color:var(--green);display:grid;place-items:center;font-style:normal;font-size:.8rem;opacity:0;transition:opacity .15s}
.sim-div:hover i,.sim-div:focus-visible i,#sim.arrastando .sim-div i{opacity:1}
#sim.arrastando{user-select:none;cursor:col-resize}
#sim.arrastando iframe{pointer-events:none}
#sim.m-pdf .sim-div,#sim.m-cartao .sim-div{display:none}
.zm{display:inline-flex;gap:4px}
.q .dif{font-size:.66rem;padding:1px 8px;margin-left:4px;white-space:nowrap;flex:none}
.apg{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;display:grid;gap:6px;justify-items:start}
.apg span{color:var(--muted);font-size:.86rem}
.tmp{width:68px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
@media(max-width:640px){.lg{display:none}}
#sim.m-pdf .sim-card,#sim.m-cartao .sim-pdf{display:none}
#sim.m-cartao .sim-card{border:0}
#sim:not(.m-cartao) .sheet{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);grid-template-rows:none;gap:2px}
#sim .area-h{margin-bottom:4px}
.simgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 14px}
.simgrid .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:9px 12px;border-radius:18px}
.simgrid .chip small{display:block;font-size:.72rem;color:var(--muted)}
.chip[aria-pressed=true] small{color:inherit;opacity:.9}
.simcols{display:grid;gap:4px 28px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:0 0 6px}
@media(max-width:800px){.sim-t{font-size:1.3rem}}
.enun-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0 10px}
.dtier{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:10px}
@media(max-width:480px){.dtier{grid-template-columns:1fr}}
.dt{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.dt h4{margin:0 0 4px;font-size:.82rem;font-weight:600}
.dt b{font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.dt span{display:block;color:var(--muted);font-size:.82rem}
.dt.alerta{border-color:var(--bad);background:var(--badbg)}
.dif.f{background:var(--greenbg);color:var(--green)}.dif.m{background:var(--warnbg);color:var(--warn)}.dif.d{background:var(--badbg);color:var(--bad)}
.enun-r td{white-space:normal;background:var(--bg)}
.enun{max-width:760px;padding:6px 4px}
.enun p{margin:0 0 8px;font-size:.92rem}
.enun ul{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.enun li{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.enun li.gab{border-color:var(--ok);background:var(--okbg)}
.enun li.voce{border-color:var(--bad);background:var(--badbg)}

.provas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.pcard{margin:0}
.selo{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--greenbg);color:var(--green);white-space:nowrap}
.selo.es{background:var(--warnbg);color:var(--warn)}.selo.no{background:var(--badbg);color:var(--bad)}
details.fazer>summary{list-style:none;cursor:pointer;display:inline-flex}details.fazer>summary::-webkit-details-marker{display:none}
.retomar{border:2px solid var(--green);background:var(--card);border-radius:20px;padding:18px 18px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.retomar .kick{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin:0 0 10px}
.retomar .rit{padding:12px 0;border-top:1px solid var(--line)}
.retomar .rit:first-of-type{border-top:0;padding-top:0}
.retomar h3{margin:0;font-size:1.3rem}
.retomar .segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:10px 0 8px}
.retomar .segs i{height:8px;border-radius:99px;background:var(--line)}
.retomar .segs i.ok{background:var(--green)}.retomar .segs i.part{background:var(--blue)}
.retomar .btn.pri{width:100%;margin-top:12px}
.retomar .mais{margin:8px 0 0}
.andamento{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bluebg);font-size:.9rem}
.chipn{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.chipn b{color:var(--ink)}.chipn.ok{border-color:var(--green)}.chipn.ok b{color:var(--green)}
/* seletor de dia */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:48px;line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:.78rem}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}
/* redação */
.redgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.redgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.redfbw{position:sticky;top:130px}}
.rrow{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.rrow{scroll-margin-top:118px}
.rrow.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.rrow .rt{font-weight:600;font-size:.92rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.rrow .rt span+span{color:var(--green);font-variant-numeric:tabular-nums}
.rrow .inl{display:none}
@media(max-width:899px){.rrow.on .inl{display:block;margin-top:10px}.redfbw{display:none}}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.lv{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;min-height:40px;font-variant-numeric:tabular-nums}
.lv:hover{border-color:var(--green)}
.lv[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.lv:focus-visible{outline:3px solid #7fa6ff;outline-offset:2px}
.redfb{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.redfb h3{margin:0 0 6px;font-size:1rem}
.redfb p{font-size:.92rem;margin:0 0 8px}
.redfb .why{border-left:3px solid var(--blue);padding-left:10px}
.redfb .up{border-left:3px solid var(--green);padding-left:10px}
.redfb .tip{border-left:3px solid var(--warn);padding-left:10px}
.foco{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.foco span{background:var(--warnbg);color:var(--warn);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:600}

/* boletim, lobby, dashboard */
.bol{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.tile span{display:block;color:var(--muted);font-size:.82rem}
.tile b{font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.ok b{color:var(--green)}
.tile.dia{background:var(--soft)}
.final{margin-top:12px;border-radius:20px;padding:18px 20px;background:var(--greenbg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.final b{font-size:2.6rem;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}
.final span{color:var(--muted)}
.cursos{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.hero{padding:10px 0 4px}
.sub{color:var(--muted);max-width:680px;margin:0 0 12px}
.examcard{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.examcard>*{min-width:0}
.examcard h2{font-size:1.3rem}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.chartbox{position:relative;margin-top:12px}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chartbox .tip{position:absolute;top:8px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.85rem;box-shadow:var(--shadow);white-space:nowrap;z-index:2;transform:translateX(-50%)}
.chartbox .tip b{display:block;margin-bottom:2px}
.chartbox .tip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sers .chip{min-height:36px;padding:4px 12px;font-size:.88rem;border-width:1.5px}
.delta.up{color:var(--ok);font-weight:600}.delta.dn{color:var(--bad);font-weight:600}
.foot{font-size:.9rem;color:var(--muted)}
.foot b{color:var(--ink)}
.foot ol{margin:6px 0 10px 20px;padding:0}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:50;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:560px){details.acc>summary small{display:none}.topbar-in{padding:6px 10px;flex-wrap:wrap}.brand{flex:1;text-align:left}.tabs{order:3;flex:1 0 100%;gap:4px}.tab{min-width:0;flex:1;padding:3px 2px}html{scroll-padding-top:112px}.panel{padding:16px;border-radius:16px}.area-h{padding:14px}.sum{padding:0 14px 12px}.acc-b{padding:0 14px 14px}details.acc>summary{padding:12px 14px}.q .tag{font-size:.6rem;padding:2px 5px;margin-left:0}.q{gap:4px;padding:3px 4px}.q .bs{gap:4px}.b{width:33px;height:33px}.q .n{width:26px}.stat b{font-size:1.3rem}.wrap{padding:12px 12px 120px}.bignota{font-size:2.8rem}}
@media(max-width:350px){.b{width:28px;height:28px;font-size:.7rem}.q .n{width:22px}.wrap{padding:12px 10px 120px}}
@media print{.topbar,.dock,.btn{display:none}}

const HABS = {"LC":{"c":{"1":"Aplicar as tecnologias da comunicação e da informação na escola, no trabalho e em outros contextos relevantes para sua vida.","2":"Conhecer e usar língua(s) estrangeira(s) moderna(s) como instrumento de acesso a informações e a outras culturas e grupos sociais*.","3":"Compreender e usar a linguagem corporal como relevante para a própria vida, integradora social e formadora da identidade.","4":"Compreender a arte como saber cultural e estético gerador de significação e integrador da organização do mundo e da própria identidade.","5":"Analisar, interpretar e aplicar recursos expressivos das linguagens, relacionando textos com seus contextos, mediante a natureza, função, organização, estrutura das manifestações, de acordo com as condições de produção e recepção.","6":"Compreender e usar os sistemas simbólicos das diferentes linguagens como meios de organização cognitiva da realidade pela constituição de significados, expressão, comunicação e informação.","7":"Confrontar opiniões e pontos de vista sobre as diferentes linguagens e suas manifestações específicas.","8":"Compreender e usar a língua portuguesa como língua materna, geradora de significação e integradora da organização do mundo e da própria identidade.","9":"Entender os princípios, a natureza, a função e o impacto das tecnologias da comunicação e da informação na sua vida pessoal e social, no desenvolvimento do conhecimento, associando-o aos conhecimentos científicos, às linguagens que lhes dão suporte, às demais tecnologias, aos processos de produção e aos problemas que se propõem solucionar."},"h":{"1":"Identificar as diferentes linguagens e seus recursos expressivos como elementos de caracterização dos sistemas de comunicação.","2":"Recorrer aos conhecimentos sobre as linguagens dos sistemas de comunicação e informação para resolver problemas sociais.","3":"Relacionar informações geradas nos sistemas de comunicação e informação, considerando a função social desses sistemas.","4 function novoEstado(ex){

/* ---------- cálculo ---------- */
function diaTemLang(d){ return Object.keys(AREAS).some(a=>AREAS[a].dia===d&&AREAS[a].lang); }
function diaLiberado(d,st=S){ return !!st.cor[d] && (!diaTemLang(d) || st.lang!==null); }
function caderno(a,st=S){
  const d=AREAS[a].dia; if(!diaLiberado(d,st)) return null;
  const c = DATA.cad[a][st.cor[d]];
  return AREAS[a].lang ? c[st.lang] : c;
}
function eap(its, oks){
  let max=-Infinity; const ll = GRID.map(g=>{
    let s=0;
    for(let i=0;i<its.length;i++){
      const A=its[i][0],B=its[i][1],C=its[i][2];
      let p=C+(1-C)/(1+Math.exp(-A*(g-B)));
      p=Math.min(1-1e-9,Math.max(1e-9,p));
      s+=Math.log(oks[i]?p:1-p);
    }
    const lp=s-0.5*g*g; if(lp>max)max=lp; return lp;
  });
  let sw=0,sg=0; for(let i=0;i<GRID.length;i++){ const w=Math.exp(ll[i]-max); sw+=w; sg+=w*GRID[i]; }
  return sg/sw;
}
function nota(a,th){ const k=DATA.k[a]; return k[0]+k[1]*th; }
function fnota(r){ return r.semTRI||r.nota===null?`${r.acertos}/${r.validas.length}`:fmt(r.nota); }
/* pronto = o aluno clicou em Corrigir (st.env[a]); sem marcação conta como em branco */
function analisar(a,st=S){
  const idx = caderno(a,st); if(!idx) return null;
  const itens = idx.map(k=>DATA.items[a][k]), ans = st.ans[a];
  const validas = []; itens.forEach((it,j)=>{ if(it[0]!==null) validas.push(j); });
  const r = {itens,validas,ans,idx};
  r.feitas = validas.filter(j=>ans[j]!=="").length;
  r.pronto = !!st.env[a];
  /* questões fora do cálculo: marcáveis para estudo; acerto é só informativo (null = sem marcação ou anulada, gabarito X) */
  r.info = {};
  itens.forEach((it,j)=>{ if(it[0]!==null) return; const g=it[4], v=ans[j]; r.info[j]=(v===""||v==="-"||!LETRAS.includes(g))?null:(v===g); });
  if(!r.pronto) return r;
  const par = validas.map(j=>itens[j]);
  const oks = validas.map(j=>ans[j]===itens[j][4]);
  r.acertos = oks.filter(Boolean).length;
  r.brancos = validas.filter(j=>ans[j]===""||ans[j]==="-").length;
  r.erros = validas.length-r.acertos-r.brancos;
  r.semMarca = validas.length-r.feitas;
  r.todosBrancos = r.brancos===validas.length;
  r.semTRI = !DATA.k[a]; r.band = (DATA.band&&DATA.band[a])||null;
  const calc = !r.todosBrancos && !r.semTRI;
  r.theta = calc ? eap(par,oks) : null;
  r.nota = calc ? nota(a,r.theta) : null;
  r.delta = {};
  if(calc){
    validas.forEach((j,n)=>{ const o2=oks.slice(); o2[n]=!o2[n]; r.delta[j]=nota(a,eap(par,o2))-r.nota; });
  }
  r.ok = {}; validas.forEach((j,n)=>r.ok[j]=oks[n]);
  return r;
}
const fmt = (x,d=1)=>(x===null||x===undefined||Number.isNaN(x))?"–":x.toFixed(d).replace(".",",");
function dificuldade(a,b){ const t=DATA.tert[a]; return b<=t[0]?["Fácil","f"]:b<=t[1]?["Média","m"]:["Difícil","d"]; }
/* erros por faixa de dificuldade (tercis do parâmetro b desta prova); só questões válidas */
const FAIXAS=[["f","Fácil"],["m","Média"],["d","Difícil"]];
function quebraDif(a,r){
  const q={f:{er:0,br:0,ac:0,tot:0},m:{er:0,br:0,ac:0,tot:0},d:{er:0,br:0,ac:0,tot:0}};
  r.validas.forEach(j=>{ const x=q[dificuldade(a,r.itens[j][1])[1]], v=r.ans[j]; x.tot++;
    if(r.ok[j]) x.ac++; else if(v===""||v==="-") x.br++; else x.er++; });
  return q;
}
function somaQuebra(l){ const t={f:{er:0,br:0,ac:0,tot:0},m:{er:0,br:0,ac:0,tot:0},d:{er:0,br:0,ac:0,tot:0}};
  l.forEach(q=>FAIXAS.forEach(([k])=>{ for(const c in t[k]) t[k][c]+=q[k][c]; })); return t; }
function tilesDif(q){
  const alerta=q.f.er>0;

}
function leituraDif(q){
  const f=q.f.er+q.f.br, m=q.m.er+q.m.br, d=q.d.er+q.d.br;
  if(!f&&!m&&!d) return "Nenhuma questão perdida.";

  return `Nenhuma fácil perdida. Suas perdas: ${m} ${m===1?"média":"médias"} e ${d} ${d===1?"difícil":"difíceis"}: o que falta é conteúdo, não distração.`;
}
const CACHE = {};
function analisarC(a){

/* panorama de acertos (além da nota TRI): contagens e taxas das áreas corrigidas.

function taxasDe(ac,er,tot){ const m=ac+er; return {marc:m?100*ac/m:null,prova:tot?100*ac/tot:null}; }

function panDe(st=S){

    por[a]={ac:r.acertos,er:r.erros,br:r.brancos,tot:r.validas.length,dif:quebraDif(a,r)}; ac+=r.acertos; er+=r.erros; br+=r.brancos; tot+=r.validas.length; n++; }

function panTiles(ac,er,br,tot,rotulo){

function stkBar(ac,er,br,tot){

}
function panoramaHtml(){
  const pn=panDe(S);
  if(!pn.n) return `<div class="empty">Corrija ao menos uma área para ver o panorama de acertos, erros e questões em branco.</div>`;
  let h=panTiles(pn.ac,pn.er,pn.br,pn.tot,`de ${pn.tot}`);
  h+=`<div class="tblw" style="margin-top:12px"><table class="pantbl" style="min-width:640px"><thead><tr><th>Área</th><th>Acertos</th><th>Erros</th><th>Em branco</th><th>% sobre o que marcou</th><th>% sobre a prova</th><th>Visão geral</th></tr></thead><tbody>`;
  for(const a in AREAS){ const v=pn.por[a], nome=AREAS[a].nome;
    if(!v){ h+=`<tr><td>${nome}</td><td colspan="6" class="hint">ainda não corrigida</td></tr>`; continue; }

    h+=`<tr><td><b>${nome}</b></td><td>${v.ac}</td><td>${v.er}</td><td>${v.br}</td><td>${pct0(t.marc)}</td><td>${pct0(t.prova)}</td><td class="bar">${stkBar(v.ac,v.er,v.br,v.tot)}</td></tr>`; }
  h+=`<tr><td><b>Total${pn.n<Object.keys(AREAS).length?" (áreas corrigidas)":""}</b></td><td><b>${pn.ac}</b></td><td><b>${pn.er}</b></td><td><b>${pn.br}</b></td><td><b>${pct0(pn.marc)}</b></td><td><b>${pct0(pn.prova)}</b></td><td class="bar">${stkBar(pn.ac,pn.er,pn.br,pn.tot)}</td></tr></tbody></table></div>
    <h3 style="margin:18px 0 0;font-size:1rem">Onde você perdeu: por dificuldade</h3>
    ${tilesDif(somaQuebra(Object.values(pn.por).map(v=>v.dif)))}
    <p class="hint" style="margin:8px 0 0">${leituraDif(somaQuebra(Object.values(pn.por).map(v=>v.dif)))}</p>
    <div class="tblw" style="margin-top:10px"><table class="pantbl" style="min-width:520px"><thead><tr><th>Área</th>${FAIXAS.map(([k,n])=>`<th><span class="dif ${k}">${n}s</span> erros</th>`).join("")}</tr></thead><tbody>${Object.keys(AREAS).filter(a=>pn.por[a]).map(a=>`<tr><td><b>${AREAS[a].nome}</b></td>${FAIXAS.map(([k])=>{ const x=pn.por[a].dif[k]; return `<td>${x.er}${x.br?` <span class="hint">+${x.br} em branco</span>`:""} <span class="hint">/ ${x.tot}</span></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="hint paninfo"><b>Dificuldade</b> é relativa a esta prova: o parâmetro b de cada questão dividido em três faixas (um terço mais fácil, um terço médio, um terço mais difícil). Erros e brancos aparecem separados.</p>
    <p class="hint paninfo"><b>% sobre o que marcou</b> = acertos ÷ (acertos + erros): mostra o quanto você acerta quando decide responder. <b>% sobre a prova</b> = acertos ÷ questões válidas (as anuladas ficam fora): é o seu aproveitamento real, contando os brancos como perdidos. Se a primeira é bem maior que a segunda, deixar em branco está custando pontos; se as duas são baixas, o ponto é conteúdo. Verde = acertos, vermelho = erros, cinza = em branco.</p>`;
  return h;
}
function redSoma(st=S){ return st.red.every(x=>x!==null)?st.red.reduce((s,x)=>s+x,0):null; }
/* notas de um estado (rascunho ou tentativa): áreas corrigidas, redação e média simples das disponíveis */
function notasDe(st){
  const n={}, vs=[];
  for(const a in AREAS){ const r=analisar(a,st); n[a]=r&&r.pronto?r.nota:null; if(n[a]!==null) vs.push(n[a]); }
  n.RED=redSoma(st); if(n.RED!==null) vs.push(n.RED);
  n.MED=vs.length?vs.reduce((s,x)=>s+x,0)/vs.length:null;
  n._n=vs.length; n._total=Object.keys(AREAS).length+1;
  return n;
}
function resumoGeral(){
  const n=notasDe(S);
  return {n:n._n,total:n._total,media:n.MED,completo:n._n===n._total,rs:n.RED,notas:n};
}

/* ---------- dados por prova (carregados quando a pessoa abre a prova) ---------- */
const LOADING = {};
function carregarDados(id){
  const ex = EXAMS[id]; if(ex.dados) return Promise.resolve(ex.dados);
  if(!LOADING[id]) LOADING[id] = new Promise((ok,erro)=>{
    const sc=document.createElement("script"); sc.src=`dados/enem_${ex.ano}.js`;
    sc.onload=()=>{ const d=(window.__DADOS||{})[ex.ano]; if(d){ ex.dados=d; ok(d); } else erro(new Error("sem dados")); };
    sc.onerror=()=>erro(new Error("falha ao carregar"));
    document.head.appendChild(sc);
  }).finally(()=>{ delete LOADING[id]; });
  return LOADING[id];
}
/* simulados salvos antes do panorama: recalcula acertos/erros/brancos pelas respostas guardadas */
function completarPan(){
  for(const h of S.hist){ if(h.pan) continue;
    try{ const pn=panDe(h); if(pn.n) h.pan={ac:pn.ac,er:pn.er,br:pn.br,tot:pn.tot,n:pn.n}; }catch(e){} }
}
function abrirExame(id){
  setExam(id); const main=$("main");
  main.innerHTML=`<section class="panel"><div class="empty">Carregando ${EX.nome}…</div></section>`; $("dock").classList.add("hidden"); $("tabs").classList.add("hidden");
  return carregarDados(id).then(()=>{ setExam(id); completarPan(); store.view="exam"; salvar(); renderAll(); window.scrollTo({top:0,behavior:"auto"}); if(store.sim&&store.sim.ex===id) simMontar(); }).catch(()=>{
    main.innerHTML=`<section class="panel"><h2>Não consegui carregar ${EX.nome}</h2><p class="hint" style="margin:6px 0 12px">Os dados desta prova são baixados na primeira vez que você a abre. Verifique a conexão e tente de novo.</p><div class="row"><button class="btn pri" type="button" data-act="abrirExam" data-ex="${id}">Tentar de novo</button><button class="btn" type="button" data-act="hub">Voltar ao hub</button></div></section>`;
  });
}

function avisoArea(a){
  const A=AREAS[a];

  if(A.classe==="ESTIMADO"){
    const bd=A.band||50, mg=bd<1?bd.toFixed(1).replace(".",","):String(Math.round(bd));

    return `<div class="note" style="margin-bottom:12px"><b>Estimativa com margem.</b> Nesta prova a nota oficial de ${A.nome} não é reproduzida exatamente pelos dados públicos do INEP. O erro típico fica abaixo de ±${mg} pontos em 95% dos casos testados: trate o número como aproximação, não como a nota oficial.</div>`;
  }
  if(A.classe==="NAO_VALIDO") return `<div class="note" style="margin-bottom:12px"><b>Sem nota TRI nesta área.</b> Para ${A.nome} desta prova, a nota oficial não pôde ser reproduzida a partir dos dados públicos. Você ainda pode marcar o cartão e ver acertos, erros, gabarito e enunciados, mas não calculamos a TRI.</div>`;

function pintar(a,skipChrome){
  const sec=$("area-"+a); if(!sec||!caderno(a)) return;
  const r=analisarC(a);
  const emSim=!!store.sim&&store.sim.areas.includes(a)&&!r.pronto, nf=emSim?S.ans[a].filter(x=>x!=="").length:r.feitas, nt=emSim?45:r.validas.length;
  const pr=$("prog-"+a); if(pr) pr.textContent=`Questões ${AREAS[a].base} a ${AREAS[a].base+44} · ${nf}/${nt} marcadas`;
  sec.querySelectorAll(".q").forEach(q=>{
    const j=+q.dataset.i, v=S.ans[a][j], it=r.itens[j];
    q.classList.remove("certa","errada");
    q.querySelectorAll(".b").forEach(b=>{ b.setAttribute("aria-checked",String(b.dataset.v===v&&v!=="")); b.classList.remove("gab"); });
    if(r.pronto&&it[0]!==null){
      q.classList.add(r.ok[j]?"certa":"errada");
      const g=q.querySelector(`.b[data-v="${it[4]}"]`); if(g) g.classList.add("gab");
    } else if(r.pronto){
      if(r.info[j]!==null&&r.info[j]!==undefined) q.classList.add(r.info[j]?"certa":"errada");
      const g=LETRAS.includes(it[4])&&q.querySelector(`.b[data-v="${it[4]}"]`); if(g) g.classList.add("gab");
    }
  });
  if(!skipChrome){
    const n=$("dk-n"), b=$("dk-b"), ask=document.querySelector("#dock [data-act=ask]");
    if(n) n.textContent=`${r.feitas}/${r.validas.length}`;
    if(b) b.style.width=Math.round(100*r.feitas/r.validas.length)+"%";
    if(ask) ask.disabled=!r.feitas;
  }
}

/* ---------- resultado de uma área ---------- */
function esc_(t){ return esc(t); }
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function linkRes(a,pos,cor,k){
  const e=DATA.enun&&DATA.enun[a]&&DATA.enun[a][k];
  const q = e&&e.q ? `${EX.sigla} ${e.q} resolução` : `${EX.sigla} questão ${pos} caderno ${COR_NOME[cor]} dia ${AREAS[a].dia} resolução`;
  return "https://www.google.com/search?q="+encodeURIComponent(q);
}
function enunHtml(a,j,r){
  const k=r.idx[j], e=DATA.enun&&DATA.enun[a]&&DATA.enun[a][k];
  if(!e||e.s.length<60) return `<div class="enun"><p class="hint">O texto desta questão não pôde ser extraído do PDF (provavelmente é uma figura, gráfico ou fórmula). Consulte o caderno ou use "Pesquisar".</p></div>`;
  const v=S.ans[a][j], g=r.itens[j][4];
  const alts=e.a.map((t,i)=>{ const L="ABCDE"[i]; if(!t) return ""; const c=L===g?"gab":(L===v?"voce":""); return `<li class="${c}"><b>${L}</b> ${esc(t)}${L===g?' <span class="hint">(gabarito)</span>':''}${L===v&&L!==g?' <span class="hint">(sua resposta)</span>':''}</li>`; }).join("");
  return `<div class="enun">${e.s.split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}<ul>${alts}</ul>
    <p class="hint">Texto extraído do caderno oficial do INEP. Figuras, gráficos e fórmulas podem faltar ou sair desalinhados: confira no seu caderno.</p></div>`;
}
function renderSum(a,r){
  const box=$("sum-"+a); if(!box) return;
  if(!r.pronto){ box.innerHTML=""; return; }
  const nFora=r.itens.filter(i=>i[0]===null).length;
  const tx=taxasDe(r.acertos,r.erros,r.validas.length);
  let h=`<div class="stats pan">
    ${r.nota!==null?`<div class="stat main"><b>${fmt(r.nota)}</b><span>${r.band?"estimativa ±"+(r.band<1?fmt(r.band):Math.round(r.band)):"nota TRI estimada"}</span></div>`:`<div class="stat main"><b>${r.acertos}<span style="font-size:.9rem"> / ${r.validas.length}</span></b><span>acertos${r.semTRI?" · sem TRI nesta área":""}</span></div>`}
    <div class="stat"><b>${r.acertos}</b><span>acertos de ${r.validas.length}</span></div>
    <div class="stat"><b>${r.erros}</b><span>erros</span></div>
    <div class="stat"><b>${r.brancos}</b><span>em branco${r.semMarca?` (${r.semMarca} sem marcação)`:""}</span></div>
    <div class="stat"><b>${pct0(tx.marc)}</b><span>de acerto sobre o que marcou (${r.acertos} de ${r.acertos+r.erros})</span></div>
    <div class="stat"><b>${pct0(tx.prova)}</b><span>de acerto sobre a prova toda (${r.acertos} de ${r.validas.length})</span></div></div>`;
  if(!r.todosBrancos){ const qd=quebraDif(a,r); h+=`<h3 style="margin:14px 0 0;font-size:1rem">Erros por dificuldade</h3>${tilesDif(qd)}<p class="hint" style="margin:8px 0 0">${leituraDif(qd)}</p>`; }
  if(r.todosBrancos) h+=`<div class="note" style="margin-top:10px">Nenhuma questão respondida: não calculo nota para cartão totalmente em branco (o tratamento desse caso varia de um ano para outro no INEP).</div>`;
  if(nFora) h+=`<p class="hint" style="margin:10px 0 0">Fora da nota: ${r.itens.map((it,j)=>it[0]===null?`<b>${AREAS[a].base+j}</b> (${it[5]===1?"anulada, gabarito X":"excluída da calibração"})`:null).filter(Boolean).join(", ")}. Dá para marcar para estudar; não altera a nota.${(()=>{const v=Object.values(r.info).filter(x=>x!==null);return v.length?` Nelas você acertou ${v.filter(Boolean).length} de ${v.length} marcadas.`:"";})()}</p>`;
  box.innerHTML=h;
}
function renderDet(a,r){
  const box=$("det-"+a); if(!box) return;
  if(!r.pronto){ box.innerHTML=""; return; }
  const cor=S.cor[AREAS[a].dia], base=AREAS[a].base, hd=HABS[a], kk=DATA.k[a], temHab=!EX.info.sem_habilidade;
  const hab={};
  r.validas.forEach(j=>{ const k=r.itens[j][3]; if(!k||!hd.h[k]) return; (hab[k]=hab[k]||{t:0,ok:0,q:[]}); hab[k].t++; if(r.ok[j])hab[k].ok++; else hab[k].q.push(base+j); });
  const lista=Object.entries(hab).map(([k,v])=>({k:+k,...v,p:v.ok/v.t})).sort((x,y)=>x.p-y.p||y.t-x.t);
  const item=x=>{ const cl=x.p<=.5?"low":x.p<.8?"mid":""; return `<div class="xi"><div class="tp"><span>H${x.k} · ${x.ok}/${x.t} (${Math.round(x.p*100)}%)</span><span class="hint">Competência ${hd.hc[x.k]}</span></div>
    <div class="pb ${cl}"><i style="width:${Math.round(x.p*100)}%"></i></div><p>${hd.h[x.k]}</p>${x.q.length?`<p style="margin-top:4px">Errou: ${x.q.map(n=>"questão "+n).join(", ")}</p>`:""}</div>`; };
  const top=lista.slice(0,5), resto=lista.slice(5), fracas=lista.filter(x=>x.p<1).length;
  let h=!temHab||!lista.length?"":`<details class="acc" data-k="rx"><summary>Raio-X: onde melhorar <small>${fracas?fracas+" habilidades com erro":"sem erros"}</small></summary><div class="acc-b">
    <p class="hint">Habilidades da Matriz de Referência do ENEM, da mais fraca para a mais forte. O INEP não divulga o assunto exato de cada questão; a habilidade indica o que ela cobra. Mostro as 5 mais fracas.</p>
    <div class="xr">${top.map(item).join("")}</div>
    ${resto.length?`<details class="paste" style="margin-top:10px"><summary>Ver todas as habilidades (${resto.length} a mais)</summary><div class="xr">${resto.map(item).join("")}</div></details>`:""}
  </div></details>`;
  h+=`<details class="acc" data-k="tb"><summary>Questão a questão <small>gabarito, dificuldade, pontos e enunciado</small></summary><div class="acc-b">
    <div class="filter"><label><input type="checkbox" data-act="soerros" data-a="${a}"> só os erros</label>
    <label><input type="checkbox" data-act="params" data-a="${a}"> mostrar parâmetros a, b, c</label></div>
    <div class="tblw" id="tw-${a}"><table id="tb-${a}"><thead><tr><th>Questão</th><th>Você</th><th>Gabarito</th><th>Resultado</th><th>Dificuldade</th><th>Pontos em jogo</th><th>Habilidade</th><th class="par">a</th><th class="par">b</th><th class="par">c</th><th>Enunciado</th><th>Resolução</th></tr></thead><tbody>`;
  r.itens.forEach((it,j)=>{
    const pos=base+j, v=S.ans[a][j], lk=`<button type="button" class="btn sm" data-act="enun" data-a="${a}" data-j="${j}">Ver</button></td><td><a href="${linkRes(a,pos,cor,r.idx[j])}" target="_blank" rel="noopener">Pesquisar</a>`;
    if(it[0]===null){
      const anul=!LETRAS.includes(it[4]), inf=r.info[j];
      const res=anul?"Anulada (gabarito X)":(inf===null?"Não conta na nota":(inf?`<span class="pos">Acertou</span> <span class="hint">· não conta na nota</span>`:`<span class="neg">Errou</span> <span class="hint">· não conta na nota</span>`));
      h+=`<tr class="fora"><td class="c">${pos}</td><td>${v==="-"?"em branco":(v||"–")}</td><td>${anul?"X":it[4]}</td><td class="res-c" style="font-weight:400">${res}</td><td>–</td><td>–</td><td>H${it[3]}</td><td class="par">–</td><td class="par">–</td><td class="par">–</td><td>${lk}</td></tr>`;
      return;
    }
    const ok=r.ok[j], dd=dificuldade(a,it[1]);
    let pts="–";
    if(r.delta[j]!==undefined){ const dl=r.delta[j]; pts=ok?`<span class="neg">${fmt(dl)} se errasse</span>`:`<span class="pos">+${fmt(dl)} se acertasse</span>`; }
    h+=`<tr class="${ok?"r-ok":"r-er"}" data-er="${ok?0:1}"><td class="c">${pos}</td><td>${v==="-"?"em branco":(v||"sem marcação")}</td><td>${it[4]}</td><td class="res-c">${ok?"Acertou":"Errou"}</td><td><span class="dif ${dd[1]}">${dd[0]}</span></td><td>${pts}</td><td>H${it[3]}</td><td class="par">${fmt(it[0],2)}</td><td class="par">${fmt(it[1],2)}</td><td class="par">${fmt(it[2],2)}</td><td>${lk}</td></tr>`;
  });
  h+=`</tbody></table></div><p class="hint" style="margin-top:8px">Dificuldade é relativa a esta prova (parâmetro b dividido em três faixas). "Pontos em jogo" é a variação da sua nota se a questão tivesse o resultado oposto, mantendo as demais.</p></div></details>`;
  h+=`<details class="acc" data-k="cl"><summary>Como esta nota foi calculada</summary><div class="acc-b"><p class="hint" style="margin:0">${r.semTRI?"Sem TRI nesta área: a nota oficial deste ano não é reproduzível com os dados públicos, então só mostramos os acertos.":r.todosBrancos?"Cartão todo em branco: sem nota calculada.":`Proficiência estimada (EAP): <code>θ = ${fmt(r.theta,4)}</code> com ${r.validas.length} questões.<br>Conversão desta área: <code>nota = ${fmt(kk[0],3)} + ${fmt(kk[1],3)} × θ = ${fmt(r.nota,2)}</code>.<br>${r.band?`Esta área é uma <b>estimativa</b>: nos testes com as notas oficiais o erro ficou abaixo de ±${Math.round(r.band)} pontos em 95% dos casos.`:"Nos testes com as notas oficiais, praticamente todos os participantes ficaram a menos de 1 ponto da nota oficial, desde que o caderno escolhido seja o da sua prova."}`}</p></div></details>`;
  box.innerHTML=h;
}


/* ---------- simulado: PDF do INEP + cartão lado a lado + cronômetro ---------- */
const SIM_DIA_MIN=330, SIM_AREA_MIN=165; /* 5h30 para o dia; 165 min = 45 questões a 3min40s */
let SIMCFG=null, SIMTK=null;
const AREA_CURTO={LC:"Linguagens",CH:"Humanas",CN:"Natureza",MT:"Matemática"};
function simAreasDe(esc){ return esc[0]==="d"?Object.keys(AREAS).filter(a=>AREAS[a].dia===+esc.slice(1)):[esc.slice(2)]; }
function simDiaDe(esc){ return esc[0]==="d"?+esc.slice(1):AREAS[esc.slice(2)].dia; }
function simMinPadrao(esc){ return esc[0]==="d"?SIM_DIA_MIN:SIM_AREA_MIN; }
function simUrl(d){ const L=(EX.info.links||{})[d]; return L&&S.cor[d]?L[S.cor[d]]||null:null; }
function fmtDur(sg){ sg=Math.max(0,Math.floor(sg)); const h=Math.floor(sg/3600), m=Math.floor(sg%3600/60), x=sg%60, d=n=>String(n).padStart(2,"0"); return `${d(h)}:${d(m)}:${d(x)}`; }
function fmtMin(m){ return Math.floor(m/60)+"h"+(m%60?String(m%60).padStart(2,"0"):""); }
/* estado parcial: áreas já corrigidas x o que falta */
function simFalta(){
  const todas=Object.keys(AREAS), feitas=todas.filter(a=>S.env[a]), pend=todas.filter(a=>!S.env[a]&&!S.ans[a].some(x=>x!==""));
  if(!feitas.length||!pend.length) return null;
  const d=AREAS[pend[0]].dia, doDia=todas.filter(a=>AREAS[a].dia===d);
  const esc=doDia.every(a=>pend.includes(a))?"d"+d:"a:"+pend[0];
  return {feitas,pend,esc};
}
function simBotaoTxt(){ const fl=simFalta(); return fl?"Fazer o que falta com cronômetro: "+fl.pend.map(x=>AREA_CURTO[x]).join(" + "):"Simulado com cronômetro e PDF"; }
function simNotaDe(a){ const r=analisarC(a); return r&&r.pronto?(r.nota!==null?fmt(r.nota):r.acertos+"/"+r.validas.length):"–"; }
function abrirSetup(){
  if(!EX.dados) return;
  const dias=[...new Set(Object.keys(AREAS).map(a=>AREAS[a].dia))].sort();
  if(!SIMCFG||SIMCFG.ex!==EX.id){ const fl=simFalta(), esc=fl?fl.esc:"d"+dias[0]; SIMCFG={ex:EX.id,esc,min:simMinPadrao(esc),edit:false,auto:true}; }
  renderSetup();
}
function simAvisoParcial(c){
  const ar=simAreasDe(c.esc), feitas=Object.keys(AREAS).filter(a=>S.env[a]), mantem=feitas.filter(a=>!ar.includes(a)), refaz=ar.filter(a=>S.env[a]||S.ans[a].some(x=>x!==""));
  if(!feitas.length&&!refaz.length) return "";
  let h=`<div class="note info" style="margin:0 0 12px">`;
  if(feitas.length) h+=`<b>Você já corrigiu:</b> ${feitas.map(a=>AREA_CURTO[a]+" "+simNotaDe(a)).join(", ")}. `;
  const fl=simFalta(); if(fl) h+=`<b>Falta:</b> ${fl.pend.map(a=>AREA_CURTO[a]).join(" e ")}. `;
  if(mantem.length&&!refaz.length) h+=`Este simulado <b>não mexe</b> em ${mantem.map(a=>AREA_CURTO[a]).join(" e ")}: as notas ficam como estão e a nova nota entra na sua média.`;
  else if(refaz.length) h+=`<b>Atenção:</b> ${refaz.map(a=>AREA_CURTO[a]).join(" e ")} já ${refaz.length>1?"têm":"tem"} preenchimento. Refazer substitui o atual; ele fica guardado no histórico ao concluir e volta se você descartar.`;
  return h+`</div>`;
}
function renderSetup(){

    ${tl?`<div><span class="lbl">Idioma da prova</span><div class="row" style="margin:6px 0 14px">${EX.langs.map((t,v)=>`<button type="button" class="chip" aria-pressed="${S.lang===v}" data-act="simLang" data-l="${v}">${t}</button>`).join("")}</div></div>`:""}</div>
    <div class="simcols"><div><span class="lbl">Tempo de prova</span><div class="row" style="margin:6px 0 4px;align-items:center"><input id="simH" class="tmp" type="number" min="0" max="10" step="1" value="${Math.floor(c.min/60)}" aria-label="Horas"><span>h</span><input id="simM" class="tmp" type="number" min="0" max="59" step="5" value="${c.min%60}" aria-label="Minutos"><span>min</span></div><span class="hint" id="simMinTxt">${fmtMin(c.min)} · padrão ${fmtMin(simMinPadrao(c.esc))}${c.esc[0]==="d"?" (dia da prova)":" (45 questões a 3min40s)"}</span></div>

  h+=`<div class="modal-act"><button class="btn" type="button" data-act="fechar">Cancelar</button><button class="btn pri" type="button" data-act="simGo" ${falta.length?"disabled":""}>Começar agora</button></div>`;
  abrirModal(h); $("modalCard").classList.add("wide");

function simTelaCheia(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(_){} }

function simIniciar(){
  const c=SIMCFG, ar=simAreasDe(c.esc), min=Math.max(5,Math.min(600,Math.round(+c.min)||simMinPadrao(c.esc)));
  const sobre=ar.some(a=>S.env[a]||S.ans[a].some(x=>x!==""));
  const antes=sobre?JSON.parse(JSON.stringify({cor:S.cor,lang:S.lang,ans:S.ans,env:S.env,red:S.red})):null;
  ar.forEach(a=>{ S.ans[a]=Array(45).fill(""); S.env[a]=false; });
  const agora=Date.now(); S.tab=ar[0];
  store.sim={ex:EX.id,areas:ar,ini:agora,fim:agora+min*60000,dur:min*60,auto:!!c.auto,lado:"E",modo:innerWidth<800?"cartao":"div",cron:{est:"dig",oc:false},pct:78,z:1,antes};
  fecharModal(); salvar(); simMontar();
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }catch(_){}

function simRascunho(){ return Object.values(S.ans).some(v=>v.some(x=>x!==""))||Object.values(S.env).some(Boolean); }

function relogioSvg(now,sm){

}

function pn_(x){

  const meds=hist.map(h=>h.notas.MED).filter(v=>v!==null);

}
function chartSvg(hist,uid){
  const n=hist.length, sel=SERIES.filter(s=>CH_SEL.has(s[0]));
  const val=(h,k)=>typeof h.notas[k]==="number"?h.notas[k]:null;
  const vs=sel.flatMap(s=>hist.map(h=>val(h,s[0])).filter(v=>v!==null));
  if(!sel.length||!vs.length) return `<div class="empty">Escolha ao menos uma série com dados para ver o gráfico.</div>`;
  let lo=Math.min(...vs), hi=Math.max(...vs); const span=Math.max(hi-lo,80), mid=(hi+lo)/2;
  lo=Math.floor((mid-span/2-20)/50)*50; hi=Math.ceil((mid+span/2+20)/50)*50; if(hi-lo<100) hi=lo+100;
  const W=640,H=260,L=44,R=100,T=12,B=30, pw=W-L-R, ph=H-T-B;
  const X=i=>n===1?L+pw/2:L+pw*i/(n-1), Y=v=>T+ph*(1-(v-lo)/(hi-lo));
  const step=(hi-lo)>400?100:50;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das notas por simulado. A tabela abaixo traz os mesmos valores.">`;
  for(let v=lo;v<=hi;v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  const every=n>14?Math.ceil(n/12):1;
  for(let i=0;i<n;i+=every){ s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}</text>`; }
  const labels=[];
  sel.forEach(se=>{
    const pts=hist.map((h,i)=>({i,v:val(h,se[0])})); let d="", open=false;
    pts.forEach(p=>{ if(p.v===null){ open=false; return; } d+=(open?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1)+" "; open=true; });
    const w=se[0]==="MED"?2.5:2;
    s+=`<path d="${d}" fill="none" stroke="var(${se[2]})" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{ if(p.v!==null) s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4.5" fill="var(${se[2]})" stroke="var(--card)" stroke-width="2"/>`; });
    const lastP=[...pts].reverse().find(p=>p.v!==null); if(lastP) labels.push({y:Y(lastP.v),x:X(lastP.i),t:`${se[1]} ${Math.round(lastP.v)}`});
  });
  labels.sort((a,b)=>a.y-b.y); for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<14) labels[i].y=labels[i-1].y+14;
  labels.forEach(l=>{ s+=`<text x="${l.x+10}" y="${l.y+4}" font-size="11.5" font-weight="600" fill="var(--ink)">${l.t}</text>`; });
  s+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  s+=`<rect class="hov" x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip hidden"></div>`;
  CHARTS[uid]={hist,sel,n,L,pw,W,X};
  return s;
}
function initCharts(){
  document.querySelectorAll(".chartbox").forEach(box=>{
    const uid=box.id.replace("cb-",""), c=CHARTS[uid], svg=box.querySelector("svg"); if(!c||!svg) return;
    const xh=svg.querySelector(".xh"), tip=box.querySelector(".tip"), hov=svg.querySelector(".hov");
    const move=e=>{
      const rc=svg.getBoundingClientRect(), x=(e.clientX-rc.left)*(c.W/rc.width);
      let i=c.n===1?0:Math.round((x-c.L)/c.pw*(c.n-1)); i=Math.max(0,Math.min(c.n-1,i));
      const px=c.X(i); xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.style.display="";
      const h=c.hist[i];
      tip.innerHTML=`<b>${esc(h.nome)} · ${new Date(h.t).toLocaleDateString("pt-BR")}</b>${h.nn&&h.nn<5?`<div class="hint">parcial: ${h.nn} de 5 notas</div>`:""}`+c.sel.map(se=>{ const v=h.notas[se[0]]; return `<div><i style="background:var(${se[2]})"></i>${se[1]}: ${v===null?"–":fmt(v)}</div>`; }).join("");
      tip.classList.remove("hidden"); const pct=px/c.W*100; tip.style.left=Math.max(14,Math.min(86,pct))+"%";
    };
    const sai=()=>{ xh.style.display="none"; tip.classList.add("hidden"); };
    hov.addEventListener("pointermove",move); hov.addEventListener("pointerdown",move); hov.addEventListener("pointerleave",sai);
  });
}

/* ---------- lobby ---------- */
const TRANSP=`<p><b>Aviso:</b> é uma <b>estimativa</b> feita com dados públicos, não a nota oficial emitida pelo INEP.</p>
  <ol>
    <li>Cada questão tem três parâmetros públicos do INEP: <b>a</b> (discriminação), <b>b</b> (dificuldade) e <b>c</b> (acerto ao acaso). A chance de acertar é <code>P(θ) = c + (1 − c) / (1 + e^(−a·(θ − b)))</code>.</li>
    <li>Com seus acertos e erros, calculamos a proficiência θ pelo método <b>EAP</b> (média a posteriori), com distribuição a priori normal padrão e 40 pontos de quadratura entre −4 e 4, como descreve o documento "Procedimentos de Análise" do INEP. Questões sem marcação contam como em branco. Questões anuladas ou sem calibração podem ser marcadas para estudo, mas ficam fora da nota.</li>
    <li>θ vira nota por uma conversão linear própria de cada área, a mesma em todos os anos validados: <code>nota = m + s · θ</code>, com Ciências da Natureza 501,144 + 113,102·θ, Ciências Humanas 501,489 + 112,310·θ, Linguagens 499,978 + 108,086·θ e Matemática 500,020 + 129,646·θ. O INEP não publica essas constantes; nós as obtivemos por regressão contra as notas oficiais.</li>
    <li>A "coerência das respostas" que o INEP cita é um efeito do próprio modelo: acertar questões difíceis e errar fáceis reduz a nota naturalmente. Não há regra extra.</li>
  </ol>
  <p><b>Validação por prova e área</b> (comparação com a nota oficial de todos os participantes da aplicação regular nos microdados):</p>
  <ul>
    <li><b>Exata</b>: pelo menos 99,9% dos participantes ficam a menos de 1 ponto da nota oficial (na grande maioria, a menos de 0,1). Os poucos restantes são cartões atípicos, como caderno marcado errado.</li>
    <li><b>Estimativa</b>: a nota oficial acompanha o cálculo, mas com ruído (correlação acima de 0,94). Mostramos a nota com a margem de erro típica, e ela <b>não</b> deve ser tratada como a nota oficial.</li>
    <li><b>Sem TRI</b>: a nota oficial não pôde ser reproduzida com os dados públicos daquela prova e área. Nesse caso mostramos só acertos, gabarito e enunciados.</li>
  </ul>
  <p><b>Parâmetros recuperados:</b> em algumas provas e áreas, o arquivo oficial de itens do INEP tem parâmetros de itens fora do lugar ou incorretos, e a nota oficial não pode ser reproduzida com eles. Nesses casos, recuperamos os parâmetros efetivamente usados a partir das notas oficiais dos participantes (busca da combinação que reproduz as notas e ajuste fino) e só adotamos o resultado quando ele também reproduz a nota oficial em cadernos e participantes que não entraram no ajuste. Cada área desse tipo traz um aviso na página da prova.</p>
  <p><b>Provas antigas:</b> a TRI só existe no ENEM a partir de 2009, e só esses anos estão aqui. Entre 2009 e 2016 o dia 1 foi Ciências Humanas e da Natureza e o dia 2 foi Linguagens e Matemática; de 2017 em diante, o dia 1 é Linguagens e Humanas. A página mostra a ordem de cada ano. Alguns anos têm limites próprios descritos no cartão de cada prova.</p>
  <p><b>Limites:</b> vale para a aplicação regular (cadernos Azul, Amarelo, Branco, Rosa e Cinza, conforme o ano). Não vale para reaplicação, PPL nem provas adaptadas. Se escolher o caderno errado, a nota sai errada, sem aviso. O INEP não publica o assunto de cada questão, só a habilidade da Matriz de Referência; é isso que o raio-X mostra (anos sem habilidade nos dados não têm raio-X). A orientação de redação segue os níveis oficiais do INEP. "Ver" mostra o enunciado extraído da prova oficial, só texto (figuras, gráficos e fórmulas podem faltar); "Pesquisar" busca na internet pela frase da questão.</p>`;
const ORD_COR=["AZUL","AMARELA","BRANCA","ROSA","CINZA","VERDE"];
function linksProva(m){
  const curto={LC:"Linguagens",CH:"Humanas",CN:"Natureza",MT:"Matemática"};
  const nomeDia=d=>Object.keys(m.areas).filter(a=>m.areas[a].dia===d).map(a=>curto[a]).join(" e ");

  if(!dias.length) return `<a class="btn sm" href="${LINK_INEP}" target="_blank" rel="noopener">Abrir a página de provas do INEP</a>`;
  return dias.map(d=>`<div style="margin-top:8px"><div class="hint" style="margin-bottom:4px"><b>Dia ${d}</b> · ${nomeDia(+d)}</div><div class="row">${Object.keys(L[d]).sort((x,y)=>ORD_COR.indexOf(x)-ORD_COR.indexOf(y)).map(c=>`<a class="btn sm" href="${L[d][c]}" target="_blank" rel="noopener"><span class="dot" style="background:${COR_HEX[c]||"#ccc"}"></span>${COR_NOME[c]||c}</a>`).join("")}</div></div>`).join("");
}
function resumoValidacao(){
  let ex=0,es=0,no=0,rc=0; for(const m of MANIFEST) for(const a of Object.values(m.areas)){ if(a.classe==="EXATO"){ ex++; if(a.recuperado) rc++; } else if(a.classe==="ESTIMADO") es++; else no++; }
  const t=ex+es+no;
  return `<b>Como saber se confio na nota:</b> comparei o cálculo com a nota oficial de todos os participantes de cada prova. Em <b>${ex} de ${t}</b> combinações de prova e área a nota bate (a menos de 1 ponto, na prática igual à oficial); ${rc?`<b>${rc}</b> delas só bateram depois de recuperarmos parâmetros de itens que estão errados no arquivo oficial. `:""}${es?`<b>${es}</b> são estimativas com margem de erro. `:""}${no?`<b>${no}</b> não têm TRI (só acertos). `:""}O selo de cada prova mostra o resultado.`;
}
function progressoSim(m,st){
  if(!st) return null;
  const as=Object.keys(m.areas), res=st.res||{};
  const marc=a=>((st.ans&&st.ans[a])||[]).filter(x=>x!==""&&x!=="-").length;
  const feitas=as.filter(a=>res[a]), rasc=as.filter(a=>!res[a]&&marc(a)>0);
  if(!feitas.length&&!rasc.length) return null;
  if(feitas.length===as.length) return null;   // completo: não é "em andamento"
  return {as,res,marc,feitas,rasc};
}
function retomarHtml(){
  const curto={LC:"Linguagens",CH:"Humanas",CN:"Natureza",MT:"Matemática"};
  let lista=MANIFEST.map(m=>({m,pr:progressoSim(m,store.estados["enem"+m.ano])})).filter(x=>x.pr);
  if(!lista.length) return {html:"",ids:new Set()};
  lista.sort((x,y)=>(("enem"+y.m.ano)===store.exam)-(("enem"+x.m.ano)===store.exam)||y.m.ano-x.m.ano);   // o último aberto vai primeiro
  const vis=lista.slice(0,3), resto=lista.length-vis.length;
  const itens=vis.map(({m,pr})=>{
    const {as,res,marc,feitas,rasc}=pr;
    const segs=as.map(a=>`<i class="${res[a]?"ok":marc(a)>0?"part":""}"></i>`).join("");

function andamento(m,st){

  return `<div class="andamento"><b>${titulo}</b> · ${sub}<div class="row" style="gap:6px;margin-top:6px">${chips}</div>${media!==null?`<div class="hint" style="margin-top:6px">Média simples do que já foi corrigido: <b>${fmt(media)}</b>${todas.length<as.length+1?" (parcial)":""}</div>`:""}${rascunho.length?`<div class="hint" style="margin-top:6px">Toque em "Continuar o simulado" para retomar de onde parou.</div>`:""}</div>`;

function selo(m){

});
document.addEventListener("keydown",e=>{
  if(!store.sim||!e.target.closest||!e.target.closest("#simDiv")) return;
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return; e.preventDefault();
  const sm=store.sim, dir=(e.key==="ArrowRight"?1:-1)*(sm.lado==="D"?-1:1); sm.pct=Math.max(20,Math.min(80,(sm.pct||78)+5*dir)); salvar(); simAplicarModo();
});
document.addEventListener("toggle",e=>{ if(e.target.id==="dashSec"&&store.view==="lobby"){ uiSet("dash",e.target.open); if(e.target.open) initCharts(); } },true);
document.addEventListener("fullscreenchange",()=>{ const b=$("simFs"); if(b) b.textContent=document.fullscreenElement?"Sair da tela cheia":"Tela cheia"; });
addEventListener("resize",()=>{ if(store.sim&&!$("sim").classList.contains("hidden")){ clearTimeout(simMontar.rz); simMontar.rz=setTimeout(()=>{ simRender(); simTick(); },200); } });
carregar();
if(store.view==="exam") abrirExame(store.exam); else renderAll();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
